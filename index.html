/* I reparti di chi sta guardando: un tecnico ha quelli delle mansioni che fa in quell'evento (se si sa quale e lui è in squadra),
   altrimenti quelli delle sue mansioni di sempre; il coordinatore nessuno (vede tutto) */
function myDepts(eventId) {
  if (S.mode !== 'tech') return [];
  const m = eventId ? T.mie.filter(x => String(x.evento.id) === String(eventId) && x.assegnazione.stato !== 'rifiutato')[0] : null;
  const out = deptsOfRoles(m ? m.assegnazione.ruoli : T.ruoli);
  // se il coordinatore lo ha nominato responsabile di un reparto per questo evento, quel reparto è «suo» anche se la sua mansione è un'altra
  const nom = eventId ? ((T.resp && T.resp.nomine) || []).filter(n => String(n.event_id) === String(eventId))[0] : null;
  return nom ? DEPTS.filter(d => out.indexOf(d) >= 0 || nom.reparti.indexOf(d) >= 0) : out;
}
/* Voci e pezzi di un gruppo di righe, in parole: «8 voci · 24 pezzi» */

/* Apre la finestra per una pianta e un evento */
async function puOpen(pid, evId) {
  const e = S.evById[evId];
  if (!e) return;
  const title = 'Usa il materiale · ' + e.cliente;
  if (e.stato === 'annullato') { toast('L\'evento è annullato: riportalo a un altro stato per cambiare il materiale.', 'err'); return; }
  if (e.scaricoQuando) { toast('Lo scarico di questo evento è già chiuso: il materiale non si cambia più.', 'err'); return; }
  openSheet(title, '<p class="empty">Leggo il materiale della pianta…</p>', { noFocus: true });
  const mark = S.sheet;
  let ctx;
  try { ctx = await call('api_pjUseCtx', CRED(), pid); }
  catch (err) { if (S.sheet === mark) puFail(title, err.message); return; }
  if (S.sheet !== mark) return;                 // l'hai chiusa mentre leggevo
  if (ctx.cestino) { puFail(title, 'Questa pianta è nel cestino: rimettila a posto dal filtro «Cestino» della scheda Progetti.'); return; }
  if (ctx.righe === null || ctx.righe === undefined) {
    openSheet(title, '<p>Di questa pianta non ho ancora l\'elenco del materiale. Si legge da solo la prima volta che la apri nell\'editor, senza cambiare niente.</p>' +
      '<p class="hint">Tocca «Apri la pianta», aspetta che si carichi e poi torna qui.</p>' +
      '<div class="sheetfoot"><button type="button" class="btn" data-act="closeSheet">Chiudi</button>' +
      '<button type="button" class="btn pri" data-act="pjOpen" data-id="' + esc(pid) + '">' + ico('plan') + ' Apri la pianta</button></div>', { noFocus: true });
    return;
  }
  PJM[pid] = { rev: ctx.matRev, ctx: ctx };
  const b = puBuild(ctx, e);
  const mine = myDepts(evId);
  PU = { pid: pid, e: e, ctx: ctx, rows: b.rows, skip: b.skip, joint: b.joint, only: b.only, mine: mine, dept: mine.length ? 'mio' : 'tutto',
    allowed: S.mode === 'tech' ? respAllowed(e) : null };
  PU.rows.forEach(r => { r.lock = puLocked(r); if (r.lock) r.on = false; });
  openSheet(title, puSheetHtml(), { noFocus: true });
  S.onClose = () => { PU = null; };
  puUpdate();
}
/* Da una pianta: prima si sceglie l'evento */
function puPickHtml(p) {
  const today = S.oggi;
  const ok = S.ev.filter(e => e.stato !== 'annullato' && !e.scaricoQuando && (S.mode !== 'tech' || e.mio));
  const up = ok.filter(e => String(e.data) >= today).sort((a, b) => String(a.data).localeCompare(String(b.data)));
  const past = ok.filter(e => String(e.data) < today).sort((a, b) => String(b.data).localeCompare(String(a.data))).slice(0, 8);
  const list = (p.event_id ? ok.filter(e => e.id === p.event_id) : []).concat(up.concat(past).filter(e => e.id !== p.event_id));
  if (!list.length) return '<p class="empty">Non ci sono eventi a cui portare il materiale. Crea prima l\'evento dalla scheda Eventi.</p>';
  return '<p class="hint" style="margin-top:0">A quale evento porto il materiale di <b>' + esc(p.nome) + '</b>?</p><ul class="cpl">' + list.map(e =>
    '<li><button type="button" class="btn cpb" data-act="pjUse" data-id="' + esc(p.id) + '" data-ev="' + esc(e.id) + '"><span class="cpn">' + esc(e.cliente) + '</span><span class="cpd">' +

}

function pjMatLineHtml(p) {
  if (!p.matRev) return 'Materiale: non ancora letto dalla pianta (si legge aprendola una volta nell\'editor).';
  const old = p.matRev !== p.rev ? ' · elenco di una versione precedente' : '';

  const e = p.event_id ? S.evById[p.event_id] : null, c = PJM[p.id];
  let t = 'Materiale: ' + plural(p.nMat, 'voce', 'voci') + ' in pianta';

    const rows = al ? b.rows.filter(r => al.indexOf(puDeptOf(r)) >= 0) : b.rows;          // un responsabile conta solo le voci dei suoi reparti
    const nNew = rows.filter(r => r.st === 'new').length, nLess = rows.filter(r => r.st === 'diff' && r.qty > r.evQ).length;

/* Legge (una volta per versione) l'elenco della pianta, per poterlo confrontare con l'evento */
function pjMatEnsure(p) {
  if (!pjCanUse() || !p.matRev || !p.nMat || !p.event_id) return;
  const c = PJM[p.id];

}

/* =====================================================================
   «DALLA PIANTA» NELLA SCHEDA MAGAZZINO: articoli nuovi o quantità dalle scorte del catalogo della pianta
   ===================================================================== */
let PS = null;      // {rows, stock}
function psBuild(r) {
  const arts = puArts(), mappa = r.mappa || {}, rows = [];
  r.stock.righe.forEach(x => {
    const item = String(x.i || ''), cat = String(x.c || ''), q = Math.max(0, Math.round(Number(x.q) || 0));
    if (!item || !(Number(x.q) > 0)) return;
    const l = puLink({ i: item, k: x.k }, mappa, arts);
    const row = { n: rows.length, cat: cat, item: item, qty: q, key: l.key, eq: l.eq, how: l.eq ? l.how : 'nuovo', wh: puWhCat(cat), have: 0, st: 'new', on: true };
    if (row.eq) {
      row.have = Math.max(0, Number(S.matById[row.eq].quantita) || 0);
      row.st = (row.how !== 'forse' && row.have === row.qty) ? 'same' : 'diff';     // un «forse» lo faccio sempre vedere: spuntarlo conferma il collegamento
      row.on = false;
    }
    rows.push(row);
  });
  return { rows: rows, stock: r.stock };
}
function psRowHtml(r) {
  const m = r.eq ? S.matById[r.eq] : null;

    '<label class="puc"><input type="checkbox" data-chg="psOn" data-i="' + r.n + '"' + (r.on ? ' checked' : '') + ' aria-label="' + (m ? 'Aggiorna' : 'Crea') + ': ' + esc(r.item) + '"></label>' +

    qtyField('p' + r.n, r.qty, 0, 99999, 'Quanti pezzi: ' + r.item, ' data-inp="psQty" data-i="' + r.n + '"') + '</li>';
}

function psUpdate() {

/* =====================================================================
   «MATERIALE DELLA PIANTA»: l'elenco di una pianta diviso per reparto. Lo vedono tutti (anche i tecnici) e non cambia niente.
   ===================================================================== */
let PM = null;      // la finestra aperta: {pid, r, rows, skip, joint, dept, mine}
function pmBuild(r) {
  const rows = [], skip = [], joint = [];
  (Array.isArray(r.righe) ? r.righe : []).forEach(x => {
    const cat = String(x.c || ''), item = String(x.i || ''), q = Number(x.q) || 0;
    if (!item || q <= 0) return;
    if (PU_SKIP.test(cat)) { skip.push({ cat: cat, item: item, q: q }); return; }
    if (PU_JOINT.test(item)) { joint.push({ cat: cat, item: item, q: q }); return; }
    rows.push({ cat: cat, dept: deptPlan(cat), item: item, q: q });
  });
  return { rows: rows, skip: skip, joint: joint };
}

  }
  if (P.joint.length) {
    h += '<details class="free"><summary>Da sapere</summary>' + puInfoList(P.joint, x => '<b>' + puQ(x.q) + '</b> ' + esc(x.item) + ' <small>(calcolati dalle prolunghe in serie)</small>') + '</details>';
  }
  return h + '<div class="sheetfoot"><button type="button" class="btn" data-act="closeSheet">Chiudi</button>' +
    '<button type="button" class="btn pri" data-act="pjOpen" data-id="' + esc(P.pid) + '">' + ico('plan') + ' Apri la pianta</button></div>';
}
ACT.pmDept = el => {
  if (!PM) return;
  PM.dept = el.dataset.d;
  $$('#sheet .pudf .cat').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.d === PM.dept)));
  $$('#sheet .pmdept').forEach(sec => { sec.hidden = !deptShown(PM.dept, PM.mine, sec.dataset.d); });
};
async function pmOpen(pid) {
  const title = 'Materiale della pianta';
  openSheet(title, '<p class="empty">Leggo il materiale della pianta…</p>', { noFocus: true });
  const mark = S.sheet;
  let r;
  try { r = await call('api_pjMat', pjAuth(), pid); }
  catch (err) { if (S.sheet === mark) puFail(title, err.message); return; }
  if (S.sheet !== mark) return;
  if (r.righe === null || r.righe === undefined) {
    openSheet(title, '<p>Di questa pianta non ho ancora l\'elenco del materiale. Si legge da solo la prima volta che qualcuno la apre nell\'editor, senza cambiare niente.</p>' +
      '<div class="sheetfoot"><button type="button" class="btn" data-act="closeSheet">Chiudi</button>' +
      '<button type="button" class="btn pri" data-act="pjOpen" data-id="' + esc(pid) + '">' + ico('plan') + ' Apri la pianta</button></div>', { noFocus: true });
    return;
  }
  const b = pmBuild(r), mine = myDepts(r.event_id);
  PM = { pid: pid, r: r, rows: b.rows, skip: b.skip, joint: b.joint, mine: mine, dept: mine.length ? 'mio' : 'tutto' };
  openSheet(r.nome || title, pmSheetHtml(), { noFocus: true });
  S.onClose = () => { PM = null; };
}
ACT.pjMat = el => { pmOpen(el.dataset.id); };
/* =====================================================================
   IL RESPONSABILE TECNICO (4.0, tappa 3)
   Tre cose, tutte con la regola del server (resp.gs): qui si nasconde quello che non si può fare, il server lo rifiuta comunque.
   1. Il coordinatore, nella squadra di un evento, nomina un tecnico responsabile di uno o più reparti (Audio, Luci, Video, Comune).
      La spunta fissa «responsabile tecnico» sul tecnico (scheda Tecnici) vale per tutti gli eventi e tutti i reparti.
   2. Il tecnico responsabile ha una sua area dentro la pagina personale: i suoi eventi (luogo, orari, note), il materiale dei suoi
      reparti (più il «comune»), il magazzino da guardare e, con la spunta fissa, gli eventi nuovi. Riusa le schermate del coordinatore
      (conti del magazzino, righe del materiale, «Aggiungi materiale», «Usa il materiale della pianta») leggendo i dati di api_respInit.
   3. Le parti comuni di una pianta (palco, americane, corrente…) cambiate da un tecnico restano «da approvare» finché il coordinatore
      o un responsabile le conferma: si vedono subito, nessuno resta bloccato.
   ===================================================================== */
const RS = { loaded: false, busy: null, err: '', tab: 'eventi', openEv: null, showPast: false };
ICO.back = '<path d="M14 6l-6 6 6 6"/><path d="M8 12h12"/>';

/* ---------- chi è responsabile e di cosa ---------- */
function respIs() { return S.mode === 'tech' && !!(T.resp && (T.resp.fisso || (T.resp.nomine && T.resp.nomine.length))); }
function respFixed() { return S.mode === 'tech' && !!(T.resp && T.resp.fisso); }
/* I reparti di cui un responsabile può cambiare il materiale di un evento: quelli della sua nomina (tutti con la spunta fissa),
   più il «comune», che vale per ogni responsabile */
function respAllowed(e) {
  const r = e && Array.isArray(e.reparti) ? e.reparti : [];
  return DEPTS.filter(d => d === 'comune' || r.indexOf(d) >= 0);
}
/* Il reparto di una riga di materiale dell'evento: quello dell'articolo di magazzino; una riga scritta a mano è «comune» */
function lineDeptOf(c) {
  const m = c && c.equipment_id ? S.matById[c.equipment_id] : null;
  return m ? deptWh(m.categoria) : 'comune';
}
function respDeptsTxt(list) { return list.map(d => DEPT_LABEL[d]).join(', '); }

/* ---------- ganci usati dalle schermate del coordinatore (coord.js) ---------- */
/* una riga di un altro reparto, o di un evento con lo scarico chiuso: si legge, non si cambia */
function respLineRO(e, c) {
  if (S.mode !== 'tech') return false;
  return !!e.scaricoQuando || respAllowed(e).indexOf(lineDeptOf(c)) < 0;
}
/* nella finestra «Aggiungi materiale» un responsabile vede solo gli articoli dei suoi reparti */
function respMatOk(e, m) { return S.mode !== 'tech' || respAllowed(e).indexOf(deptWh(m.categoria)) >= 0; }
function respAddHint(e) {
  if (S.mode !== 'tech') return '';
  const al = respAllowed(e);
  if (al.length >= DEPTS.length) return '';
  return '<p class="hint">Qui vedi gli articoli di: ' + esc(respDeptsTxt(al)) + '. Quelli degli altri reparti li aggiunge il loro responsabile.</p>';
}

/* =====================================================================
   1. IL COORDINATORE NOMINA (dentro la squadra di un evento)
   ===================================================================== */
function respNomHtml(a) {
  const cur = deptList(a.responsabileDi);
  return '<div class="respnom"><p class="hint" style="margin:0 0 8px">Responsabile di quale reparto, <b>per questo evento</b>? Dalla sua pagina cambia luogo, orari e note, ' +
    'il materiale di quei reparti (più il comune: palco, americane, corrente) e approva le modifiche degli altri alle parti comuni delle piante. ' +
    'Non vede prezzi, contatti dei clienti, spese né compensi. Per averlo su tutti gli eventi usa la spunta nella scheda Tecnici.</p>' +
    '<div class="cats" role="group" aria-label="Reparti di cui è responsabile">' + DEPTS.map(d =>
      '<button type="button" class="cat" data-act="respSet" data-id="' + esc(a.id) + '" data-d="' + d + '" aria-pressed="' + (cur.indexOf(d) >= 0) + '">' +
      esc(DEPT_LABEL[d]) + (DEPT_HINT[d] ? ' <small>' + esc(DEPT_HINT[d]) + '</small>' : '') + '</button>').join('') + '</div>' +
    (cur.length ? '<div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-act="respSet" data-id="' + esc(a.id) + '" data-d="">' +
      ico('x') + ' Togli la nomina</button></div>' : '<p class="hint" style="margin:8px 0 0">Ora non è responsabile di questo evento.</p>') + '</div>';
}
ACT.respOpen = el => { S.respFor = S.respFor === el.dataset.id ? null : el.dataset.id; S.addRoleFor = null; paint(); };
ACT.respSet = el => {
  const a = S.asg.find(x => x.id === el.dataset.id);
  if (!a) return;
  const d = el.dataset.d;
  let cur = deptList(a.responsabileDi);
  if (!d) cur = [];
  else cur = cur.indexOf(d) >= 0 ? cur.filter(x => x !== d) : cur.concat([d]);
  mutate(async () => {
    const res = await call('api_setResp', S.pin, a.id, cur);
    upsert(S.asg, res);
    derive(); paint();
    toast(cur.length ? firstName(a.tecnico) + ' è responsabile di: ' + respDeptsTxt(deptList(cur)) + '.' : firstName(a.tecnico) + ' non è più responsabile di questo evento.', 'ok');
  });
};

/* =====================================================================
   2. L'AREA DEL RESPONSABILE (nella pagina personale del tecnico)
   ===================================================================== */
function respEntryHtml() {
  if (!respIs()) return '';
  let t;
  if (respFixed()) {
    t = 'Sei responsabile di tutti gli eventi e di tutti i reparti: cambi luogo, orari e note, il materiale, crei eventi nuovi e approvi le modifiche alle parti comuni delle piante.';
  } else {
    const names = (T.resp.nomine || []).map(n => {
      const m = T.mie.filter(x => String(x.evento.id) === String(n.event_id))[0];
      return (m ? m.evento.cliente : 'un evento') + ' (' + respDeptsTxt(n.reparti) + ')';
    });
    t = 'Il coordinatore ti ha nominato responsabile di: ' + names.join(', ') + '.';
  }
  const pend = PJ.list !== null ? pcPending().filter(pcMay).length : 0;
  return '<section class="respcard" aria-label="Responsabile tecnico"><div class="respic">' + ico('user') + '</div><div class="respbody"><b>Responsabile tecnico</b><p>' + esc(t) + '</p>' +
    (pend ? '<p><span class="pill warn">' + plural(pend, 'pianta da approvare', 'piante da approvare') + '</span></p>' : '') + '</div>' +
    '<button type="button" class="btn pri" data-act="respGo">Apri</button></section>';
}
ACT.respGo = () => {
  T.page = 'resp'; RS.err = '';
  paint(); window.scrollTo(0, 0);
  respLoad().then(() => paint()).catch(e => { RS.err = e.message; paint(); });
};
ACT.respRetry = () => ACT.respGo();
ACT.respBack = () => { T.page = 'mie'; RS.openEv = null; S.openLine = null; paint(); window.scrollTo(0, 0); };
ACT.respTab = el => { RS.tab = el.dataset.tab; RS.openEv = null; S.openLine = null; S.openStk = null; paint(); window.scrollTo(0, 0); };
CHG.respPast = el => { RS.showPast = el.checked; paint(); };
ACT.respToggle = el => {
  const id = el.dataset.id;
  RS.openEv = RS.openEv === id ? null : id;
  S.openLine = null;
  paint();
  const n = document.getElementById('ev-' + id);
  if (RS.openEv && n) n.scrollIntoView({ block: 'nearest' });
};

/* Legge dal server quello che serve alla schermata (senza prezzi né contatti) e lo mette dove lo cercano le schermate del coordinatore */
function respLoad() {
  if (RS.busy) return RS.busy;
  RS.busy = (async () => {
    try {
      const d = await call('api_respInit', S.token);
      S.oggi = d.oggi || S.oggi;
      S.cfg = Object.assign(S.cfg || {}, { durata_evento_ore: d.durata_evento_ore || 4 });
      S.tec = []; S.disp = []; S.fur = []; S.fe = []; S.rip = []; S.mov = []; S.spe = []; S.mancano = [];
      S.ev = d.eventi || []; S.asg = d.assegnazioni || []; S.mat = d.materiali || []; S.car = d.carico || [];
      S.comp = d.composizione || []; S.cvar = d.variazioni || [];
      derive();
      RS.loaded = true; RS.err = '';
      if (!PJ.loading) await pjLoad();          // le piante: servono per «da approvare» e per le piante di ogni evento
    } finally { RS.busy = null; }
  })();
  return RS.busy;
}

function respView() {
  const tabs = [['eventi', 'Eventi'], ['mag', 'Magazzino']];
  let body;
  if (!RS.loaded) {
    body = RS.err
      ? '<div class="pageerr" role="alert"><h2>Non riesco a caricare gli eventi</h2><p>' + esc(RS.err) + '</p><div class="row" style="margin-top:12px"><button type="button" class="btn pri" data-act="respRetry">Riprova</button></div></div>'
      : '<p class="empty">Carico gli eventi…</p>';
  } else body = RS.tab === 'mag' ? respViewMag() : respViewEventi();
  return '<header class="mast"><div class="wrap mastin"><div class="brand brresp">Responsabile tecnico<small>' + esc(firstName(T.nome)) + '</small></div><div class="mastact">' +
    '<button class="ib" data-act="respBack" aria-label="Torna alla tua pagina">' + ico('back') + '</button>' +
    '<button class="ib" data-act="techRefresh" aria-label="Aggiorna i dati">' + ico('refresh') + '</button></div></div></header>' +
    '<div class="stick"><nav class="tabs" role="tablist" aria-label="Sezioni"><div class="wrap tabsin">' +
    tabs.map(t => '<button role="tab" class="tab" aria-selected="' + (RS.tab === t[0]) + '" data-act="respTab" data-tab="' + t[0] + '">' + t[1] + '</button>').join('') +
    '</div></nav><div class="hazard"></div></div><main class="wrap main" role="tabpanel">' + body + '</main>';
}

/* ---------- gli eventi ---------- */
function respViewEventi() {
  const mine = S.ev.filter(e => e.mio);
  const up = mine.filter(isUpcoming).sort(cmpEv);
  const past = mine.filter(e => !isUpcoming(e)).sort((a, b) => cmpEv(b, a));
  let h = '<div class="toolbar">' + (respFixed() ? '<button type="button" class="btn pri" data-act="respNew">' + ico('plus') + ' Nuovo evento</button>' : '<span></span>') +
    (past.length ? '<label class="chk"><input type="checkbox" data-chg="respPast"' + (RS.showPast ? ' checked' : '') + '> Mostra anche gli ultimi giorni</label>' : '') + '</div>';
  h += pcBoxHtml();
  if (!up.length && !(RS.showPast && past.length)) {
    h += '<p class="empty">' + (respFixed() ? 'Nessun evento in programma. Tocca «Nuovo evento» per aggiungerne uno.' : 'Non hai eventi in programma come responsabile.') + '</p>';
  }
  h += groupByDay(up, respEvRow, true);
  if (RS.showPast && past.length) h += '<h2 class="monthsep" style="margin-top:28px">Ultimi giorni</h2>' + groupByDay(past, respEvRow, true);
  return h;
}
function respEvRow(e) {
  const open = RS.openEv === e.id;
  const cov = coverage(e);
  const sub = evSubBits(e);
  const ms = matSummary(e);
  if (ms.lines) sub.push('<span>' + plural(ms.lines, 'voce', 'voci') + ' di materiale</span>');
  if (ms.shortLines) sub.push('<span class="alert">manca materiale</span>');
  else if (!ms.lines && e.stato === 'confermato' && isUpcoming(e)) sub.push('<span class="warnt">Elenco del materiale da fare</span>');
  const pend = PJ.list !== null ? pcPending().filter(p => p.event_id === e.id).length : 0;
  if (pend) sub.push('<span class="warnt">' + plural(pend, 'pianta da approvare', 'piante da approvare') + '</span>');
  if (!respFixed()) sub.push('<span>Responsabile · <b>' + esc(respDeptsTxt(deptList(e.reparti))) + '</b></span>');
  let slots = cov.slots.map(slotHtml).join('');
  if (!cov.slots.length) slots = '<span class="muted" style="font-size:14px">Nessun ruolo richiesto</span>';
  return '<article class="ev st-' + esc(e.stato) + (open ? ' open' : '') + '" id="ev-' + esc(e.id) + '">' +
    '<button type="button" class="evh" data-act="respToggle" data-id="' + esc(e.id) + '" aria-expanded="' + open + '">' +
    '<span class="evtop"><span class="evt">' + esc(e.cliente || 'Senza nome') + '</span>' +
    '<span class="pill ' + (STAGE_PILL[e.stato] || 'muted') + '">' + esc(STAGE_LABEL[e.stato] || e.stato) + '</span></span>' +
    (sub.length ? '<span class="evsub">' + sub.join('') + '</span>' : '') +
    (slots ? '<span class="slots">' + slots + '</span>' : '') + '</button>' +
    (open ? respEvPanel(e, cov) : '') + '</article>';
}
function respEvPanel(e, cov) {
  let h = '<div class="panel">' + timesHtml(e);
  const facts = [];
  if (e.luogo) facts.push('<div><span class="k">Luogo: </span>' + esc(e.luogo) + '</div>');
  if (e.noteTecnici) facts.push('<div><span class="k">Note per i tecnici: </span>' + esc(e.noteTecnici) + '</div>');
  if (e.noteSopralluogo) facts.push('<div><span class="k">Sopralluogo: </span>' + esc(e.noteSopralluogo) + '</div>');
  if (facts.length) h += '<div class="facts">' + facts.join('') + '</div>';
  const when = fmtStamp(e.statoAggiornato);
  h += '<div class="stline"><span class="pill ' + (STAGE_PILL[e.stato] || 'muted') + '">' + esc(STAGE_LABEL[e.stato] || e.stato) + '</span>' +
    (when ? '<span class="muted">dal ' + esc(when) + '</span>' : '') + (e.statoNota ? '<span class="stn">«' + esc(e.statoNota) + '»</span>' : '') + '</div>';
  h += '<div class="row" style="margin-top:12px"><button type="button" class="btn sm pri" data-act="respEdit" data-id="' + esc(e.id) + '">' +
    ico('edit') + ' Luogo, orari e note</button></div>';
  h += '<h4>Squadra</h4>' + respSquadraHtml(e);
  if (cov.open.length) h += '<p class="note muted" style="margin-top:8px">Ruoli ancora da coprire: ' + esc(cov.open.join(', ')) + '. La squadra la decide il coordinatore.</p>';
  h += respMatHtml(e);
  h += pjEventHtml(e);
  return h + '</div>';
}
function respSquadraHtml(e) {
  const list = S.asgByEv[e.id] || [];
  if (!list.length) return '<p class="muted">Non c\'è ancora nessuno in squadra: la squadra la decide il coordinatore.</p>';
  return '<ul class="asgs">' + list.map(a => {
    const roles = uniq(rolesOf(a.ruoli)), refused = a.stato === 'rifiutato';
    const rd = a.resp === 'tutti' ? 'tutto' : respDeptsTxt(deptList(a.resp));
    return '<li class="asg ' + esc(a.stato.replace(/\s/g, '-')) + '"><div class="asgtop"><b>' + esc(a.tecnico) + '</b>' +
      roles.map(r => '<span class="chip r-' + r + (refused ? ' off' : '') + '">' + r + '</span>').join('') +
      '<span class="pill ' + (ASG_PILL[a.stato] || 'muted') + '">' + esc(a.stato) + '</span>' +
      (a.resp && !refused ? '<span class="pill ok">responsabile · ' + esc(rd) + '</span>' : '') +
      (a.direttoLocation && !refused ? '<span class="pill blue">direttamente in location</span>' : '') + '</div></li>';
  }).join('') + '</ul>';
}
/* Il materiale dell'evento, raggruppato per reparto: le righe degli altri reparti si leggono ma non si toccano */
function respMatHtml(e) {
  const lines = S.carByEv[e.id] || [];
  const closed = !!e.scaricoQuando, al = respAllowed(e);
  let h = '<h4>Materiale</h4>';
  if (!lines.length) {
    h += '<p class="muted">Non c\'è ancora l\'elenco di cosa si monta.' + (closed ? '' : ' Aggiungilo qui, oppure portalo dalla pianta qui sotto.') + '</p>';
  } else {
    const ms = matSummary(e);
    h += '<p class="matsum">' + plural(ms.lines, 'voce', 'voci') + ', ' + plural(ms.pieces, 'pezzo', 'pezzi') +
      (ms.rent ? ' <span class="pill blue">' + ms.rent + ' a noleggio</span>' : '') +
      (ms.shortLines ? ' <span class="pill bad">manca materiale</span>' : ' <span class="pill ok">tutto disponibile</span>') + '</p>';
    DEPTS.forEach(d => {
      const ls = lines.filter(c => lineDeptOf(c) === d).sort((a, b) => cmpName(lineName(a), lineName(b)));
      if (!ls.length) return;
      const mine = al.indexOf(d) >= 0 && !closed;
      h += '<h5 class="rdept' + (mine ? '' : ' off') + '">' + esc(DEPT_LABEL[d]) + (mine ? '' : ' <small>solo da guardare</small>') + '</h5><ul class="mats">' +
        ls.map(c => lineRow(e, c)).join('') + '</ul>';
    });
  }
  if (closed) return h + '<p class="note muted">Lo scarico di questo evento è chiuso: il materiale non si cambia più.</p>';
  return h + '<div class="row" style="margin-top:12px"><button type="button" class="btn sm pri" data-act="matAdd" data-id="' + esc(e.id) + '">' + ico('plus') + ' Aggiungi materiale</button></div>';
}

/* ---------- luogo, orari e note / evento nuovo ---------- */
function respEvFormHtml(e) {
  const v = e || {}, isNew = !v.id;
  let h = '<form data-submit="respEvForm" data-id="' + esc(v.id || '') + '" novalidate>';
  if (isNew) {
    h += '<label class="fld"><span>Cliente o nome dell\'evento</span><input type="text" name="cliente" maxlength="120" autocomplete="off"></label>' +
      '<label class="fld"><span>Data</span><input type="date" name="data" value="' + esc(S.oggi) + '" min="' + esc(S.oggi) + '"></label>';
  }
  h += '<label class="fld"><span>Luogo</span><input type="text" name="luogo" maxlength="160" value="' + esc(v.luogo || '') + '" autocomplete="off"></label>';

    h += '<fieldset class="fld"><legend>Quanti tecnici servono</legend><div class="steps">' + ROLES.map(r => stepper(r, 0)).join('') + '</div>' +
      '<p class="hint">Chi fa parte della squadra lo decide il coordinatore.</p></fieldset>';
  }
  h += timesFormHtml(Object.assign({}, v, { orarioInizioEvento: v.orarioInizioEvento || v.ora })) +
    '<label class="fld"><span>Note per i tecnici (le leggono nella convocazione)</span><textarea name="noteTecnici" maxlength="2000">' + esc(v.noteTecnici || '') + '</textarea></label>' +
    '<label class="fld"><span>Note del sopralluogo (le vedi tu, il coordinatore e gli altri responsabili)</span><textarea name="noteSopralluogo" maxlength="2000">' + esc(v.noteSopralluogo || '') + '</textarea></label>' +
    '<p class="hint">' + (isNew
      ? 'L\'evento nasce come «Richiesta» con il tuo nome: poi lo prende in carico il coordinatore (stato, squadra, prezzi).'
      : 'Cliente, data e stato li cambia il coordinatore. Ogni modifica resta registrata con il tuo nome e l\'ora.') + '</p>' +
    '<p class="ferr" role="alert"></p><div class="sheetfoot"><button type="button" class="btn" data-act="closeSheet">Annulla</button>' +
    '<button type="submit" class="btn pri">' + (isNew ? 'Crea l\'evento' : 'Salva') + '</button></div></form>';
  return h;
}
ACT.respEdit = el => { const e = S.evById[el.dataset.id]; if (e) openSheet('Luogo, orari e note · ' + e.cliente, respEvFormHtml(e), { noFocus: true }); };
ACT.respNew = () => openSheet('Nuovo evento', respEvFormHtml(null), { noFocus: true });
SUB.respEvForm = async form => {
  const f = new FormData(form), g = k => String(f.get(k) == null ? '' : f.get(k)).trim();
  const id = form.dataset.id || '', err = $('.ferr', form);
  const o = { luogo: g('luogo'), noteTecnici: g('noteTecnici'), noteSopralluogo: g('noteSopralluogo'), furgoneCarico: g('furgoneCarico') };
  TIME_FIELDS.forEach(x => { o[x[0]] = g(x[0]); });
  if (o.furgoneCarico === 'gia') o.orarioPartenza = '';         // furgone già carico: non c'è un'ora di partenza a parte
  if (!id) {
    o.cliente = g('cliente'); o.data = g('data'); o.ora = o.orarioInizioEvento;
    ROLES.forEach(r => { o[r] = parseInt(f.get(r), 10) || 0; });
    if (!o.cliente) { err.textContent = 'Scrivi il nome del cliente o dell\'evento.'; $('[name=cliente]', form).focus(); return; }
    if (!parseYMD(o.data)) { err.textContent = 'Scegli la data.'; $('[name=data]', form).focus(); return; }
  }
  err.textContent = '';
  const r = await mutate(async () => {
    if (!id) {
      const res = await call('api_respEvNew', S.token, o);
      upsert(S.ev, Object.assign({}, res.evento, { mio: true, reparti: DEPTS.slice(), nMateriali: 0 }));
      derive();
      closeSheet(); RS.tab = 'eventi'; RS.openEv = res.evento.id; paint();
      const n = document.getElementById('ev-' + res.evento.id);
      if (n) n.scrollIntoView({ block: 'nearest' });
      const av = res.avvisi || [];
      toast(['Evento creato: parte come «richiesta», poi lo prende il coordinatore.'].concat(av).join(' '), av.length ? '' : 'ok');
    } else {
      const res = await call('api_respEvSave', S.token, id, o);
      const prev = S.evById[id] || {};
      upsert(S.ev, Object.assign({}, res.evento, { mio: prev.mio, reparti: prev.reparti, nMateriali: prev.nMateriali }));
      derive();
      closeSheet(); paint();
      const ch = res.cambiati || [], av = res.avvisi || [];
      toast([ch.length ? 'Salvato: ' + ch.join(', ') + '.' : 'Non è cambiato niente.'].concat(av).join(' '), av.length ? '' : 'ok');
    }
  }, true);
  if (!r.ok) err.textContent = r.err;
};

/* ---------- il magazzino, da guardare ---------- */
function respViewMag() {
  return '<p class="hint" style="margin:14px 0 0">Il magazzino lo gestisce il coordinatore: qui guardi cosa c\'è e cosa è libero in un giorno (senza prezzi). ' +
    'Per portare il materiale in un evento usa l\'evento.</p>' + viewArticoli();
}

/* =====================================================================
   3. PARTI COMUNI «DA APPROVARE»
   ===================================================================== */
/* le piante con parti comuni in attesa (il server manda comune = {da, quando} oppure niente) */
function pcPending() { return pjLive().filter(p => p.tipo === 'progetto' && p.comune); }
/* chi può approvare: il coordinatore; un tecnico con la spunta fissa; un tecnico nominato per l'evento della pianta */
function pcMay(p) {
  if (S.mode === 'coord') return true;
  if (S.mode !== 'tech' || !respIs()) return false;
  if (respFixed()) return true;
  return !!p && !!p.event_id && (T.resp.nomine || []).some(n => String(n.event_id) === String(p.event_id));
}
function pcBadge(p) { return p && p.comune && !p.cestino ? '<span class="pill warn">parti comuni da approvare</span>' : ''; }
function pcWho(p) {
  const c = p.comune || {};
  return 'Cambiate' + (c.da ? ' da ' + firstName(c.da) : '') + (c.quando ? ' · ' + fmtWhen(c.quando) : '') + (p.evento ? ' · ' + p.evento : '');
}

/* Il coordinatore: cosa hanno cambiato i responsabili in questo evento (chi, cosa e quando). Le modifiche le legge dal registro dell'evento. */
function respChangesHtml(e) {
  const l = (S.modResp || []).filter(x => x.event_id === e.id).reverse();
  if (!l.length) return '';
  const shown = l.slice(0, 8);
  return '<details class="free respchg"><summary>Cosa hanno cambiato i responsabili (' + l.length + ')</summary><ul>' +
    shown.map(x => '<li><span class="muted">' + esc(fmtStamp(x.quando)) + '</span> ' + esc(x.nota) + '</li>').join('') + '</ul>' +
    (l.length > shown.length ? '<p class="hint">Le altre ' + (l.length - shown.length) + ' modifiche sono nel foglio «Storico».</p>' : '') + '</details>';
}

/* L'elenco «Da approvare» in cima alla scheda Progetti e all'area del responsabile */
function pcBoxHtml() {
  if (PJ.list === null) return '';
  const l = pcPending().filter(pcMay);
  if (!l.length) return '';
  return '<section class="pcbox" aria-label="Da approvare"><h3>Da approvare<small>' + l.length + '</small></h3>' +
    '<p class="hint">Qualcuno ha cambiato le parti comuni (palco, americane, corrente…) di queste piante. Si vedono già, ma aspettano la tua conferma.</p><ul>' +
    l.map(p => '<li><span class="pjn">' + esc(p.nome) + '<small>' + esc(pcWho(p)) + '</small></span>' +
      '<button type="button" class="btn sm pri" data-act="pcOpen" data-id="' + esc(p.id) + '">Controlla</button></li>').join('') + '</ul></section>';
}
function pcKey(r) { return pjNorm(r[0]) + '|' + pjNorm(r[1]); }
function pcMap(rows) {
  const m = {};
  (rows || []).forEach(r => {
    const k = pcKey(r);
    m[k] = { cat: r[0], item: r[1], q: (m[k] ? m[k].q : 0) + (Number(r[2]) || 0) };
  });
  return m;
}
/* Cosa è cambiato nell'elenco delle parti comuni: voci nuove, tolte, con un numero diverso */
function pcDiff(before, now) {
  const b = pcMap(before), n = pcMap(now), add = [], del = [], chg = [];
  Object.keys(n).forEach(k => {
    if (!b[k]) add.push(n[k]);
    else if (Math.abs(b[k].q - n[k].q) > 1e-9) chg.push({ item: n[k].item, from: b[k].q, to: n[k].q });
  });
  Object.keys(b).forEach(k => { if (!n[k]) del.push(b[k]); });
  return { add: add, del: del, chg: chg };
}
function pcSheetHtml(d, may) {
  const df = pcDiff(d.approvate, d.ora);
  let h = '';
  if (!d.daApprovare) {
    h += '<p class="note ok">Le parti comuni di questa pianta sono approvate: non c\'è niente da fare.</p>';
  } else {
    h += '<p class="note warn">Le parti comuni sono state cambiate' + (d.da ? ' da <b>' + esc(d.da) + '</b>' : '') + (d.quando ? ' (' + esc(fmtWhen(d.quando)) + ')' : '') +
      ' e aspettano di essere approvate. Nella pianta si vedono già.</p>';
    if (df.add.length || df.del.length || df.chg.length) {
      h += '<h4 class="pch">Cosa è cambiato nell\'elenco</h4><ul class="pcdiff">' +
        df.add.map(x => '<li class="add"><b>+ ' + esc(puQ(x.q)) + '</b> ' + esc(x.item) + ' <small>' + esc(x.cat) + '</small></li>').join('') +
        df.del.map(x => '<li class="del"><b>− ' + esc(puQ(x.q)) + '</b> ' + esc(x.item) + ' <small>' + esc(x.cat) + '</small></li>').join('') +
        df.chg.map(x => '<li class="chg">' + esc(x.item) + ': <s>' + esc(puQ(x.from)) + '</s> → <b>' + esc(puQ(x.to)) + '</b></li>').join('') + '</ul>';
    } else {
      h += '<p class="hint">Nell\'elenco del materiale non cambia niente: sono stati spostati o modificati dei pezzi sulla pianta (posizione, misure…). Apri la pianta per vederli.</p>';
    }
  }
  if (d.okQuando) {
    h += '<p class="hint">Ultima versione approvata' + (d.okDa ? ' da ' + esc(d.okDa) : '') + ': ' + esc(fmtWhen(d.okQuando)) + (d.okRev ? ' (versione ' + d.okRev + ')' : '') + '.</p>';
  }
  if (d.ora.length) {
    h += '<details class="free"><summary>Le parti comuni adesso (' + d.ora.length + ')</summary>' +
      puInfoList(d.ora, x => '<b>' + esc(puQ(x[2])) + ' ×</b> ' + esc(x[1]) + ' <small>' + esc(x[0]) + '</small>') + '</details>';
  }
  h += '<div class="row" style="margin-top:12px"><button type="button" class="btn sm" data-act="pjOpen" data-id="' + esc(d.id) + '">' + ico('plan') + ' Apri la pianta</button></div>';
  if (d.daApprovare && may) {
    h += '<p class="hint">«Rimetti com\'era» riporta la pianta all\'ultima versione approvata: anche le altre modifiche fatte dopo tornano indietro (la versione di adesso resta nelle versioni salvate).</p>' +
      '<div class="sheetfoot pcfoot"><button type="button" class="btn danger" data-act="pcUndo" data-id="' + esc(d.id) + '" data-confirm="Rimetto com\'era? Tocca di nuovo">Rimetti com\'era</button>' +
      '<button type="button" class="btn pri" data-act="pcOk" data-id="' + esc(d.id) + '">' + ico('check') + ' Approva</button></div>';
  } else {
    h += (d.daApprovare ? '<p class="hint">Le approva il coordinatore o un responsabile tecnico.</p>' : '') +
      '<div class="sheetfoot"><button type="button" class="btn pri" data-act="closeSheet">Chiudi</button></div>';
  }
  return h;
}
/* aggiorna l'elenco già in pagina senza rileggerlo */
function pcLocal(pid, val) {
  [PJ.list, S.mode === 'tech' ? T.piante : null].forEach(l => (l || []).forEach(p => { if (p.id === pid) p.comune = val; }));
}
ACT.pcOpen = async el => {
  const pid = el.dataset.id, p = pjById(pid) || (S.mode === 'tech' ? (T.piante || []).filter(x => x.id === pid)[0] : null);
  const title = 'Parti comuni · ' + (p ? p.nome : 'pianta');
  openSheet(title, '<p class="empty">Leggo cosa è cambiato…</p>', { noFocus: true });
  const mark = S.sheet;
  let d;
  try { d = await call('api_pjComune', pjAuth(), pid); }
  catch (err) { if (S.sheet === mark) puFail(title, err.message); return; }
  if (S.sheet !== mark) return;
  openSheet(title, pcSheetHtml(d, pcMay({ event_id: d.event_id })), { noFocus: true });
};
ACT.pcOk = el => {
  const pid = el.dataset.id;
  mutate(async () => {
    const d = await call('api_pjComuneOk', pjAuth(), pid);
    pcLocal(pid, d.daApprovare ? { da: d.da, quando: d.quando } : null);
    closeSheet(); paint();
    toast('Parti comuni approvate.', 'ok');
  });
};
ACT.pcUndo = el => {
  const pid = el.dataset.id;
  mutate(async () => {
    const d = await call('api_pjComuneUndo', pjAuth(), pid);
    pcLocal(pid, d.daApprovare ? { da: d.da, quando: d.quando } : null);
    await pjLoad();                    // la pianta ha una versione nuova
    closeSheet(); paint();
    toast('Pianta rimessa com\'era all\'ultima versione approvata.', 'ok');
  });
};

if (S.mode === 'tech') techBoot();
else if (S.mode === 'confirm') confirmBoot();
else coordBoot();
</script>
