ACT.editEv = el => { const e = S.evById[el.dataset.id]; if (e) openSheet('Modifica evento', evFormHtml(e)); };
function applyEventResult(res) {
  const prev = S.evById[res.evento.id];
  res.evento.nMateriali = prev ? prev.nMateriali : 0;
  upsert(S.ev, res.evento);
  S.asg = S.asg.filter(a => a.event_id !== res.evento.id).concat(res.assegnazioni || []);
  derive();
}
SUB.evForm = async form => {
  const f = new FormData(form);
  const g = k => String(f.get(k) || '').trim();
  const ev = { id: g('id') || undefined, cliente: g('cliente'), data: g('data'), stato: g('stato') || 'richiesta',
    luogo: g('luogo'), noteTecnici: g('noteTecnici'), noteSopralluogo: g('noteSopralluogo'),
    materialePrima: parseInt(f.get('materialePrima'), 10) || 0, materialeDopo: parseInt(f.get('materialeDopo'), 10) || 0 };
  TIME_FIELDS.forEach(x => { ev[x[0]] = g(x[0]); });
  ev.ora = ev.orarioInizioEvento;
  ev.furgoneCarico = g('furgoneCarico');
  if (ev.furgoneCarico === 'gia') ev.orarioPartenza = '';   // furgone già carico: non c'è un'ora di partenza a parte
  ROLES.forEach(r => { ev[r] = parseInt(f.get(r), 10) || 0; });
  const err = $('.ferr', form);
  if (!ev.cliente) { err.textContent = 'Scrivi il nome del cliente o dell\'evento.'; $('[name=cliente]', form).focus(); return; }
  if (!parseYMD(ev.data)) { err.textContent = 'Scegli la data.'; $('[name=data]', form).focus(); return; }
  err.textContent = '';
  const before = ev.id ? S.evById[ev.id] : null;
  const r = await mutate(async () => {
    const res = await call('api_saveEvent', S.pin, ev);
    applyEventResult(res);
    closeSheet();
    S.openEv = res.evento.id; S.prop = null;
    paint();
    const n = document.getElementById('ev-' + res.evento.id);
    if (n) n.scrollIntoView({ block: 'nearest' });
    const av = res.avvisi || [];
    toast(['Evento salvato.'].concat(av).join(' '), av.length ? '' : 'ok');
    // Se è cambiato qualcosa che riguarda i tecnici già convocati (giorno, orari, luogo, note) propongo di avvisarli
    const changes = before ? diffEvent(before, res.evento) : [];
    if (changes.length && res.evento.stato !== 'annullato') offerNotify(res.evento.id, 'dati', { changes: changes });
  }, true);
  if (!r.ok) err.textContent = r.err;
};
/* materiale dell'evento: righe */
/* Sostituisce le righe di materiale di un evento con quelle appena date dal server. Se il server dice che il carico
   si è riaperto (perché il materiale è cambiato) lo segno anche qui. */
function setLines(evId, righe, liste) {
  S.car = S.car.filter(c => c.event_id !== evId).concat(righe);
  // le variazioni di un case seguono la sua riga: se la riga non c'è più (il server le toglie) non contano più
  const alive = {}; righe.forEach(c => { alive[c.id] = true; });
  S.cvar = S.cvar.filter(v => v.event_id !== evId || alive[v.line_id]);
  const e = S.evById[evId];
  if (e) { e.nMateriali = righe.length; if (liste) Object.assign(e, liste); }
  derive();
}
ACT.qstep = el => {
  const inp = $('input', el.parentNode);
  const min = +inp.min, max = +inp.max;
  let n = parseInt(inp.value, 10);

  inp.value = Math.min(max, Math.max(min, n + (+el.dataset.d)));
  inp.dispatchEvent(new Event('input', { bubbles: true }));
};

function copyHtml(e, list) {
  const have = (S.carByEv[e.id] || []).length;
  if (!list.length) return '<p class="empty">Nessun altro evento ha ancora un elenco di materiale.</p>';
  return '<p class="hint" style="margin-top:0">Scegli l\'evento da cui copiare. ' +
    (have ? '<b>Qui ci sono già ' + plural(have, 'voce', 'voci') + ': i pezzi si sommano.</b> ' : '') +
    'Il noleggio da fuori non si copia: va rivalutato per questo evento.</p><ul class="cpl">' + list.map(f =>
      '<li><button type="button" class="btn cpb" data-act="copyFrom" data-to="' + esc(e.id) + '" data-from="' + esc(f.id) + '"' +
      (have ? ' data-confirm="Tocca di nuovo: li sommo"' : '') + '><span class="cpn">' + esc(f.cliente) + '</span><span class="cpd">' +
      esc(fmtShort(f.data)) + ' · ' + plural(f.nMateriali, 'voce', 'voci') + ' · ' + esc(STAGE_LABEL[f.stato]) + '</span></button></li>').join('') + '</ul>';
}

SUB.matForm = async form => {
  const f = new FormData(form), g = k => String(f.get(k) == null ? '' : f.get(k)).trim();
  const m = { id: g('id') || undefined, nome: g('nome'), categoria: g('categoria'), marca: g('marca'), quantita: g('quantita'),
    fuoriServizio: g('fuoriServizio'), consumabile: f.has('consumabile'), dismesso: f.has('dismesso'), note: g('note'),
    peso_kg: g('peso_kg'), larghezza_mm: g('larghezza_mm'), altezza_mm: g('altezza_mm'), profondita_mm: g('profondita_mm'),
    altezzaInstallazioneMm: g('altezzaInstallazioneMm'), scortaMinima: g('scortaMinima'),
    tipo: f.has('tipo') ? 'case' : '', posizione: g('posizione'), contenuto: g('contenuto') };
  const err = $('.ferr', form);
  if (!m.nome) { err.textContent = 'Scrivi il nome dell\'articolo.'; $('[name=nome]', form).focus(); return; }
  err.textContent = '';
  const isNew = !m.id;
  const r = await mutate(async () => {
    const was = m.id ? S.matById[m.id] : null, wasCase = !!(was && isCase(was));
    const saved = await call('api_saveMateriale', S.pin, m);
    upsert(S.mat, saved);
    S.car.forEach(c => { if (c.equipment_id === saved.id) c.materiale = saved.nome; });
    // il nome è anche nelle composizioni e nelle variazioni dei case; se non è più un case le sue non hanno più senso (lo fa anche il server)
    S.comp.forEach(r => { if (r.equipment_id === saved.id) r.materiale = saved.nome; if (r.case_id === saved.id) r.nomeCase = saved.nome; });
    S.cvar.forEach(v => { if (v.equipment_id === saved.id) v.materiale = saved.nome; });
    if (!isCase(saved)) { S.comp = S.comp.filter(r => r.case_id !== saved.id); S.cvar = S.cvar.filter(v => v.case_id !== saved.id); }
    derive();
    closeSheet();
    S.tab = 'mag'; S.openStk = saved.id; paint();
    toast(isNew ? 'Articolo aggiunto.' : 'Articolo salvato.', 'ok');
    // un case nuovo (o appena diventato tale): subito si indica cosa c'è dentro, perché i conti del magazzino lo contino
    if (isCase(saved) && !wasCase && !S.compByCase[saved.id]) ACT.compOpen({ dataset: { id: saved.id } });
  }, true);
  if (!r.ok) err.textContent = r.err;
};

/* ---------- composizione standard di un case: cosa c'è dentro a ogni copia ---------- */
/* Quanti pezzi di un articolo i case danno per dentro, se in questo case ce ne fossero q per copia (contando anche gli altri case) */
function compClaim(cm, a, q) {
  const others = (S.holdIn[a.id] || []).filter(h => h.c.id !== cm.id).reduce((n, h) => n + stockOf(h.c) * h.per, 0);
  return others + stockOf(cm) * q;
}
function compAvHtml(cm, a, q) {
  const have = Number(a.quantita) || 0, claim = compClaim(cm, a, q);
  if (q && claim > have) return '<span class="pkav bad">i case ne vogliono ' + claim + ' ma ne hai ' + have + '</span>';
  return '<span class="pkav ok">ne hai ' + have + (q ? ' · nei case ' + claim : '') + '</span>';
}
function compRow(cm, a, q) {
  const cat = catKey(a.categoria) || 'generale';
  const text = (a.nome + ' ' + (a.marca || '') + ' ' + catLabel(cat)).toLowerCase();
  return '<li class="pk' + (q ? ' sel' : '') + '" data-id="' + esc(a.id) + '" data-q="' + esc(text) + '">' +
    '<div class="pkm"><b>' + esc(a.nome) + '</b><small>' + esc([a.marca, catLabel(cat)].filter(Boolean).join(' · ')) + '</small>' + compAvHtml(cm, a, q) + '</div>' +
    qtyField('c-' + a.id, q, 0, 9999, 'Quanti ' + a.nome + ' dentro a ogni case', ' data-inp="compQty" data-id="' + esc(a.id) + '"') + '</li>';
}
function compSheetHtml(cm) {
  const items = S.mat.filter(a => !isCase(a) && String(a.stato) !== 'dismesso').sort((a, b) => cmpCat(a.categoria, b.categoria) || cmpName(a.nome, b.nome));
  const first = items.filter(a => S.compQ[a.id] > 0), rest = items.filter(a => !(S.compQ[a.id] > 0));
  const copies = stockOf(cm);
  let h = '<p class="hint" style="margin-top:0">Quello che c\'è dentro a <b>ogni</b> «' + esc(cm.nome) + '» pronto' + (copies > 1 ? ' (ne hai ' + copies + ' utilizzabili)' : '') +
    '. Questi pezzi sono già nel totale del loro articolo, ma finché stanno nel case non si possono dare ad altri eventi: così i conti del magazzino tornano. ' +
    'In preparazione segni se per un evento aggiungi o togli qualcosa; allo scarico si rimette com\'è qui.</p>';
  if (!items.length) return h + '<p class="empty">Non hai ancora articoli da mettere dentro. Aggiungili dalla scheda Articoli.</p><div class="sheetfoot"><button type="button" class="btn pri" data-act="closeSheet">Chiudi</button></div>';
  h += '<input type="search" id="compq" class="srch" data-inp="compSearch" placeholder="Cerca: cavo, ponte, ciabatta…" aria-label="Cerca nel magazzino" autocomplete="off" autocapitalize="off">';
  h += '<ul class="pick" id="complist">' + first.concat(rest).map(a => compRow(cm, a, S.compQ[a.id] || 0)).join('') + '</ul>';
  h += '<p class="empty" id="comp-empty" hidden>Nessun articolo trovato. Prova un\'altra parola.</p>';
  h += '<p class="ferr" role="alert"></p><div class="sheetfoot sticky"><button type="button" class="btn" data-act="closeSheet">Annulla</button>' +
    '<button type="button" class="btn pri" id="compgo" data-act="compGo">Salva</button></div>';
  return h;
}
function compTally() {
  const n = Object.keys(S.compQ).length;
  const b = $('#compgo');
  if (b) b.textContent = n ? 'Salva (' + plural(n, 'articolo', 'articoli') + ')' : 'Salva: niente dentro';
}
ACT.compOpen = el => {
  const cm = S.matById[el.dataset.id];
  if (!cm || !isCase(cm)) return;
  S.compFor = cm.id; S.compQ = {};
  (S.compByCase[cm.id] || []).forEach(x => { S.compQ[x.id] = x.q; });
  openSheet('Cosa c\'è dentro: ' + cm.nome, compSheetHtml(cm), { noFocus: true });
  compTally();
};
INP.compSearch = () => {
  const words = ($('#compq').value || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;
  $$('#complist .pk').forEach(li => {
    const ok = words.every(w => li.dataset.q.indexOf(w) >= 0);
    li.hidden = !ok;
    if (ok) shown++;
  });
  const em = $('#comp-empty');
  if (em) em.hidden = shown > 0;
};
INP.compQty = el => {
  const n = Math.max(0, Math.min(9999, parseInt(el.value, 10) || 0));
  const id = el.dataset.id, cm = S.matById[S.compFor], a = S.matById[id];

ACT.compGo = async () => {

  }, true);
  if (!r.ok && err) err.textContent = r.err;
};

  }, true);
  if (!r.ok) err.textContent = r.err;
};

/* =====================================================================
   COORDINATORE - furgoni dell'evento, avvisi di carico e scarico, giornata con più eventi, spese dell'evento
   ===================================================================== */

/* ---------- dati di logistica ---------- */
function activeVans() { return S.fur.filter(v => v.attivo !== false); }
function eventLines(evId) { return (S.carByEv[evId] || []).filter(c => toI(c.quantita) >= 1); }
/* Una riga del materiale come la vede la lista: stessa forma che il server dà ai tecnici */
function lineView(c) {
  const m = c.equipment_id ? S.matById[c.equipment_id] : null;
  const o = {
    id: c.id, nome: lineName(c), categoria: m ? catKey(m.categoria) : '', consumabile: m ? isTrue(m.consumabile) : false,
    quantita: toI(c.quantita), subnoleggio: toI(c.subnoleggio), caricato: toI(c.caricato), scaricato: toI(c.scaricato),
    danneggiato: toI(c.danneggiato), mancante: toI(c.mancante), van_id: c.van_id || '', note: c.note || '',
    mancaDa: c.mancaDa || '', mancaNota: c.mancaNota || '',
    tipo: m && isCase(m) ? 'case' : '', posizione: m ? (m.posizione || '') : '', contenuto: m && isCase(m) ? (m.contenuto || '') : '',
    key: c.equipment_id ? 'e:' + c.equipment_id : 'n:' + String(lineName(c)).trim().toLowerCase(),
  };
  if (m && isCase(m)) {   // cosa c'è dentro di standard e cosa è cambiato per questo evento, come lo vedono i tecnici
    o.comp = compList(m).map(x => ({ key: 'e:' + x.m.id, nome: x.m.nome, q: x.q }));
    o.varia = lineVars(c.id).map(v => {
      const a = v.equipment_id ? S.matById[v.equipment_id] : null;
      return { id: v.id, key: v.equipment_id ? 'e:' + v.equipment_id : '', nome: a ? a.nome : v.materiale, delta: toSI(v.delta),
        rimesso: String(v.rimesso || ''), nota: String(v.nota || '') };
    });
  }
  return o;
}
/* I furgoni di un evento, nella stessa forma che vedono i tecnici (+ la riga di FurgoniEvento in fe) */
function vansOfEvent(evId) {
  return (S.feByEv[evId] || []).map(f => {
    const v = S.furById[f.van_id];
    return { id: f.van_id, nome: v ? v.nome : f.furgone, targa: v ? (v.targa || '') : '', autista: f.autista || '', fe: f };
  });
}
/* Il carico c'è stato (chiuso o almeno iniziato) */
function loadedEv(e) { return !!e.caricoQuando || eventLines(e.id).some(c => toI(c.caricato) > 0); }
/* Il materiale doveva essere rientrato (ultimo giorno di uscita passato) ma lo scarico non è stato chiuso */
function dueUnload(e) {
  if (e.stato === 'annullato' || e.scaricoQuando || !loadedEv(e)) return false;
  const r = occRange(e);
  return !!r && r[1] < dayNum(S.oggi);
}

/* ---------- orari: due eventi si pestano i piedi? ---------- */
/* null = vanno bene; altrimenti {level: 'bad' (si sovrappongono) | 'warn' (poco margine o orari mancanti), why}.
   da, db: chi va direttamente in location (per un tecnico) parte dall'arrivo in location, non dal magazzino. */
function gapLevel(a, b, da, db) {
  const wa = evWin(a, da === true), wb = evWin(b, db === true);
  if (!wa || !wb || wa.s === null || wb.s === null) return { level: 'warn', why: 'gli orari non sono ancora indicati' };
  if (wa.a0 < wb.a1 && wb.a0 < wa.a1) return { level: 'bad', why: 'gli orari si sovrappongono' };
  const gap = wa.a1 <= wb.a0 ? wb.a0 - wa.a1 : wa.a0 - wb.a1;
  if (gap < TIGHT_GAP_MIN) return { level: 'warn', why: 'tra uno e l\'altro c\'è poco tempo (' + (gap < 1 ? 'nessuno stacco' : gap + ' minuti') + '): controlla che ci si riesca' };
  return null;
}
/* Il furgone è già impegnato in un altro evento nei giorni di questo? [{level, e, why}] */
function vanClashes(vanId, e) {
  const out = [], r1 = occRange(e);
  (S.feByVan[vanId] || []).forEach(f => {
    if (f.event_id === e.id) return;
    const o = S.evById[f.event_id];
    if (!o || o.stato === 'annullato' || o.scaricoQuando) return;
    const r2 = occRange(o);
    if (!r1 || !r2 || r1[0] > r2[1] || r2[0] > r1[1]) return;
    if (r1[0] === r1[1] && r2[0] === r2[1]) {
      const g = gapLevel(e, o);
      if (g) out.push({ level: g.level, e: o, why: g.why });
    } else {
      out.push({ level: 'bad', e: o, why: 'il furgone resta fuori anche per quell\'altro evento' });
    }
  });
  return out;
}
function clashText(v, c) {
  return v.nome + ' è già su «' + c.e.cliente + '» (' + rangeTxt(evWin(c.e)) + '): ' + c.why + '.';
}

/* ---------- peso e ingombro di quello che va su un furgone ---------- */
function loadStats(lines) {
  let kg = 0, m3 = 0, noKg = 0, noDim = 0;
  lines.forEach(c => {
    const q = fromStock(c);
    if (!q) return;
    const m = c.equipment_id ? S.matById[c.equipment_id] : null;
    if (!m) { noKg++; noDim++; return; }
    if (m.peso_kg !== '' && m.peso_kg != null && isFinite(Number(m.peso_kg))) kg += Number(m.peso_kg) * q; else noKg++;
    const d = [m.larghezza_mm, m.altezza_mm, m.profondita_mm];
    if (d.every(x => x !== '' && x != null && Number(x) > 0)) m3 += d.reduce((p, x) => p * Number(x), 1) * q / 1e9; else noDim++;
  });
  return { kg: kg, m3: m3, noKg: noKg, noDim: noDim };
}
function vanCapacityHtml(van, mine) {
  if (!mine.length) return '<p class="note muted">Su questo furgone non c\'è ancora niente.</p>';
  const s = loadStats(mine), cap = toN(van && van.portata_kg), vol = toN(van && van.volume_m3);
  const bits = [];
  let level = 'muted';
  if (s.kg > 0) {
    bits.push('Peso circa ' + fmtNum(s.kg, 0) + ' kg' + (cap > 0 ? ' su ' + fmtNum(cap, 0) + ' di portata' : ''));
    if (cap > 0 && s.kg > cap) level = 'bad'; else if (cap > 0 && s.kg > cap * 0.9) level = 'warn';
  }
  if (s.m3 > 0) {
    bits.push('ingombro circa ' + fmtNum(s.m3, 1) + ' m³' + (vol > 0 ? ' su ' + fmtNum(vol, 1) : '') + ' (stima)');
    if (vol > 0 && s.m3 > vol) level = 'bad';
  }
  if (!bits.length) {
    return '<p class="note muted">Per calcolare peso e ingombro scrivi peso e misure nelle schede degli articoli.</p>';
  }
  let t = bits.join(', ') + '.';
  if (s.kg > 0 && s.noKg) t += ' ' + plural(s.noKg, 'voce senza peso non contata', 'voci senza peso non contate') + '.';
  if (s.kg > 0 && !cap) t += ' Scrivi la portata del furgone (Magazzino, Furgoni) per il controllo.';
  return '<p class="note ' + level + '">' + esc(t) + '</p>';
}

/* ---------- avvisi nella riga dell'evento ---------- */
function logiBadges(e) {
  const out = [];
  if (e.stato === 'annullato') return out;
  const lines = eventLines(e.id);
  if (!lines.length) return out;
  if (!e.scaricoQuando && vansOfEvent(e.id).some(v => vanClashes(v.id, e).some(c => c.level === 'bad'))) {
    out.push('<span class="alert">Un furgone è già su un altro evento</span>');
  }
  if (e.scaricoQuando) return out;
  if (dueUnload(e)) { out.push('<span class="alert">Scarico da chiudere</span>'); return out; }
  const pc = lprogress(lines, 'carico'), pu = lprogress(lines, 'scarico');
  // carico chiuso ma con pezzi che mancano: non è «fatto» (lo dice la striscia dei problemi), quindi niente segno verde
  if (e.caricoQuando) { if (!loadMissing(lines).pieces) out.push('<span class="okt">Carico chiuso</span>'); }
  else if (pc.got > 0) out.push('<span>Carico <b>' + pc.done + '/' + pc.total + '</b></span>');
  if (pu.got > 0) out.push('<span>Scarico <b>' + pu.done + '/' + pu.total + '</b></span>');
  return out;
}

/* ---------- materiale con problemi, in evidenza nella riga dell'evento ---------- */
/* Cosa non va con il materiale di un evento: articoli che non bastano, pezzi che mancano al carico, pezzi danneggiati o
   mancanti al rientro. level: 'bad' (rosso), 'warn' (giallo), 'done' (già sistemato con la chiusura dello scarico, resta come storia) */
function evProblems(e) {
  const p = { items: [] };           // ogni problema ha il suo livello: bad (rosso), warn (giallo), done (grigio: già successo, già sistemato)
  if (e.stato === 'annullato') return p;
  const lines = eventLines(e.id);
  if (!lines.length) return p;
  const closed = !!e.scaricoQuando;
  if (!closed && isUpcoming(e)) {
    const ms = matSummary(e);
    if (ms.shortLines) p.items.push({ level: 'bad', text: 'Manca materiale (' + plural(ms.shortLines, 'articolo', 'articoli') + ')' });
  }
  if (!closed && e.caricoQuando) {
    const lm = loadMissing(lines);
    if (lm.pieces) {
      const w = missWhere(lm, false);
      p.items.push({ level: 'warn', text: 'Carico chiuso incompleto: ' + (lm.pieces === 1 ? 'manca 1 pezzo' : 'mancano ' + lm.pieces + ' pezzi') +
        (w.length && (lm.ext || lm.van) ? ' (' + w.join(', ') + ')' : '') });
    }
  }
  // al rientro: danneggiati e mancanti (il materiale di consumo che finisce non è un problema)
  let dmg = 0, lost = 0;
  lines.forEach(c => {
    const m = c.equipment_id ? S.matById[c.equipment_id] : null;
    dmg += toI(c.danneggiato);
    if (!(m && isTrue(m.consumabile))) lost += toI(c.mancante);
  });
  if (dmg || lost) {
    const bits = [];
    if (dmg) bits.push(plural(dmg, 'pezzo danneggiato', 'pezzi danneggiati'));
    if (lost) bits.push(plural(lost, 'pezzo mancante', 'pezzi mancanti'));
    p.items.push({ level: closed ? 'done' : 'bad', text: (closed ? 'Al rientro: ' : 'Rientro: ') + bits.join(' e ') });
  }
  return p;
}
function evProbHtml(e) {
  return evProblems(e).items.map(i => '<span class="evprob ' + i.level + '" role="status">' + ico('warn') + '<span>' + esc(i.text) + '</span></span>').join('');
}

/* ---------- sezione "Furgoni e carico" nella scheda dell'evento ---------- */
function vanRowHtml(e, v, vans, lines, locked) {
  const mine = vans.length > 1 ? lines.filter(c => c.van_id === v.id) : lines;
  const fe = v.fe, van = S.furById[v.id];
  const squad = (S.asgByEv[e.id] || []).filter(a => a.stato !== 'rifiutato');
  const driving = {};
  vans.forEach(x => { if (x.id !== v.id && x.fe.autista_id) driving[x.fe.autista_id] = x.nome; });
  let opts = '<option value="">Nessuno</option>';
  squad.forEach(a => {
    const other = driving[a.technician_id];
    opts += '<option value="' + esc(a.technician_id) + '"' + (fe.autista_id === a.technician_id ? ' selected' : '') + (other ? ' disabled' : '') + '>' +
      esc(a.tecnico) + (other ? ' (guida ' + esc(other) + ')' : '') + '</option>';
  });
  const clashes = vanClashes(v.id, e);
  return '<li class="van" data-van="' + esc(v.id) + '"><div class="vtop"><span class="vname">' + ico('truck') + '<b>' + esc(v.nome) + '</b>' +
    (v.targa ? '<small>' + esc(v.targa) + '</small>' : '') + '</span>' +
    (locked ? '' : '<button type="button" class="btn sm danger" data-act="vanDel" data-id="' + esc(fe.id) + '" data-confirm="Sicuro? Tocca di nuovo">Togli</button>') + '</div>' +
    (squad.length
      ? '<label class="fld vdrv"><span>Chi guida</span><select data-chg="vanDriver" data-ev="' + esc(e.id) + '" data-van="' + esc(v.id) + '"' + (locked ? ' disabled' : '') + '>' + opts + '</select></label>'
      : '<p class="note muted">Chi guida lo scegli quando c\'è qualcuno in squadra.</p>') +
    clashes.map(c => '<p class="note ' + (c.level === 'bad' ? 'bad' : 'warn') + '">' + esc(clashText(v, c)) + '</p>').join('') +
    vanCapacityHtml(van, mine) +
    (vans.length > 1 && !locked
      ? '<div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-act="vanLines" data-ev="' + esc(e.id) + '" data-van="' + esc(v.id) + '">' +
        ico('list') + ' Cosa va su questo furgone (' + mine.length + ')</button></div>' : '') + '</li>';
}
function vanSectionHtml(e) {
  if (e.stato === 'annullato') return '';
  const lines = eventLines(e.id);
  const vans = vansOfEvent(e.id);
  const locked = !!e.scaricoQuando;
  let h = '<h4>Furgoni e carico</h4>';
  if (!S.fur.length && !vans.length) {
    h += '<p class="muted">Non hai ancora inserito i furgoni. Aggiungili dalla scheda Magazzino, voce «Furgoni»: poi li assegni qui agli eventi.</p>' +
      '<div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-act="goTab" data-tab="mag" data-sub="furgoni">' + ico('truck') + ' Aggiungi i furgoni</button></div>';
  } else {
    if (!vans.length) h += '<p class="muted">Nessun furgone assegnato. Scegli quali portare: sai così chi guida e cosa va su ciascuno.</p>';
    else h += '<ul class="vans">' + vans.map(v => vanRowHtml(e, v, vans, lines, locked)).join('') + '</ul>';
    if (vans.length > 1) {
      const loose = lines.filter(c => !vans.some(v => v.id === c.van_id)).length;
      if (loose) h += '<p class="note warn">' + plural(loose, 'voce non è ancora assegnata a un furgone', 'voci non sono ancora assegnate a un furgone') + '.</p>';
    }

    if (free.length && !locked) {

  } else {
    h += '<p class="muted" style="margin-top:10px">Appena aggiungi il materiale, qui trovi le liste di carico e di scarico.</p>';
  }
  return h;
}

/* ---------- azioni sui furgoni ---------- */
function applyVanState(evId, res) {

}

function vlTally() {

/* ---------- "Da sistemare" in cima agli eventi ---------- */
function reimbList() { return S.spe.filter(x => x.pagatoDa === 'tecnico' && !x.rimborsatoIl); }
function reimbSummary() {
  const l = reimbList(), techs = {};
  l.forEach(x => { techs[x.technician_id] = true; });
  return { n: l.length, tot: l.reduce((s, x) => s + toN(x.importo), 0), techs: Object.keys(techs).length };
}
function todoItems() {
  const out = [];
  S.ev.filter(dueUnload).sort(cmpEv).forEach(e => out.push({
    text: 'Scarico da chiudere: ' + e.cliente + ' (' + fmtShort(e.data) + ')', act: 'listOpen', ev: e.id, kind: 'scarico' }));
  // carico chiuso con dei pezzi che mancano, per gli eventi che devono ancora fare (quelli passati hanno già «scarico da chiudere»)
  S.ev.filter(e => e.caricoQuando && !e.scaricoQuando && e.stato !== 'annullato' && String(e.data) >= S.oggi).sort(cmpEv).forEach(e => {

      (lm.ext ? ', ' + lm.ext + ' da fornitore esterno' : ''), act: 'listOpen', ev: e.id, kind: 'carico' });
  });
  const rb = reimbSummary();
  if (rb.n) out.push({ text: 'Rimborsi da fare: ' + plural(rb.n, 'spesa', 'spese') + ', ' + fmtEur(rb.tot) + ' (' + plural(rb.techs, 'tecnico', 'tecnici') + ')', act: 'goTab', tab: 'tecnici' });
  const toRepair = S.rip.filter(r => r.stato === 'da riparare').reduce((s, r) => s + toI(r.quantita), 0);
  if (toRepair) out.push({ text: plural(toRepair, 'pezzo', 'pezzi') + ' da portare in riparazione', act: 'goTab', tab: 'mag', sub: 'rip' });

  if (low) out.push({ text: plural(low, 'articolo sotto scorta', 'articoli sotto scorta'), act: 'goTab', tab: 'mag', sub: 'articoli', cat: '~scorta' });
  const bad = S.mat.filter(m => String(m.stato) !== 'dismesso' && !isCase(m) && caseOver(m) > 0).length;
  if (bad) out.push({ text: 'Non tornano i conti dei case per ' + plural(bad, 'articolo', 'articoli') + ': i case ne chiedono più di quelli che hai', act: 'goTab', tab: 'mag', sub: 'articoli', cat: '' });
  return out;
}

/* ---------- giornata con più eventi ---------- */
function dayEvents(date) { return S.ev.filter(x => x.data === date && x.stato !== 'annullato').sort(cmpEv); }
/* Cosa c'è da controllare quel giorno: tecnici in due posti, furgoni doppi, materiale che non basta per tutti */
function dayShared(date) {
  const byEq = {};
  dayEvents(date).filter(holdsStock).forEach(e => {
    const d = S.demandByEv[e.id] || {};
    Object.keys(d).forEach(id => { if (d[id]) (byEq[id] = byEq[id] || []).push({ e: e, q: d[id] }); });
  });
  return Object.keys(byEq).map(id => {
    const m = S.matById[id], users = byEq[id];
    if (!m || users.length < 2) return null;
    const need = neededTogether(users), stock = looseOf(m), locked = lockedOf(m);
    return { m: m, users: users, need: need, stock: stock, locked: locked, short: Math.max(0, need - stock), sum: users.reduce((s, x) => s + x.q, 0) };
  }).filter(Boolean).sort((a, b) => (b.short - a.short) || cmpName(a.m.nome, b.m.nome));
}
function dayTechs(date) {
  const by = {};
  dayEvents(date).forEach(e => (S.asgByEv[e.id] || []).forEach(a => {
    if (a.stato === 'rifiutato') return;
    const rec = (by[a.technician_id] = by[a.technician_id] || { name: a.tecnico, list: [], dir: {} });
    rec.list.push(e);
    rec.dir[e.id] = directOf(a);
  }));
  return Object.keys(by).map(id => {
    const x = by[id], issues = [];
    for (let i = 0; i < x.list.length; i++) for (let j = i + 1; j < x.list.length; j++) {
      const g = gapLevel(x.list[i], x.list[j], x.dir[x.list[i].id], x.dir[x.list[j].id]);
      if (g) issues.push({ level: g.level, text: x.list[i].cliente + ' e ' + x.list[j].cliente + ': ' + g.why + '.' });
    }
    return { id: id, name: x.name, list: x.list, dir: x.dir, issues: issues };
  }).filter(x => x.list.length >= 2).sort((a, b) => cmpName(a.name, b.name));
}
function dayVans(date) {
  const evs = dayEvents(date);
  return activeVans().map(v => {
    const on = evs.filter(e => (S.feByEv[e.id] || []).some(f => f.van_id === v.id));
    const issues = [];
    for (let i = 0; i < on.length; i++) {
      vanClashes(v.id, on[i]).forEach(c => {
        if (on.indexOf(c.e) > i) issues.push({ level: c.level, text: on[i].cliente + ' e ' + c.e.cliente + ': ' + c.why + '.' });
      });
    }
    return { v: v, on: on, issues: issues };
  });
}
function dayIssueCount(date) {
  if (dayEvents(date).length < 2) return 0;
  return dayTechs(date).reduce((n, x) => n + x.issues.length, 0) + dayVans(date).reduce((n, x) => n + x.issues.length, 0) +
    dayShared(date).filter(x => x.short > 0).length;
}
function dayBarHtml(date, n) {
  const k = dayIssueCount(date);
  return '<button type="button" class="daybar' + (k ? ' warn' : '') + '" data-act="dayOpen" data-d="' + esc(date) + '">' + ico('cal') + '<span>' +
    n + ' eventi lo stesso giorno: controlla la giornata</span>' + (k ? '<em>' + plural(k, 'avviso', 'avvisi') + '</em>' : '') + '</button>';
}
function dayBodyHtml(date) {
  const evs = dayEvents(date);

  h += '<h3 class="dsec">Eventi</h3><ul class="dayl">' + evs.map(e => '<li><span class="dtm">' + esc(rangeTxt(evWin(e))) + '</span><span class="dev"><b>' + esc(e.cliente) + '</b>' +

  const tecs = dayTechs(date);
  h += '<h3 class="dsec">Tecnici in più eventi</h3>';

    (x.issues.length ? x.issues.map(i => '<p class="note ' + (i.level === 'bad' ? 'bad' : 'warn') + '">' + esc(i.text) + '</p>').join('') : '<p class="note ok">Ha il tempo per spostarsi.</p>') + '</li>').join('') + '</ul>';

  else h += '<ul class="dayl">' + vans.map(x => '<li class="col"><b>' + ico('truck') + esc(x.v.nome) + '</b>' +
    '<span class="dsub">' + (x.on.length ? x.on.map(e => esc(e.cliente) + ' (' + esc(rangeTxt(evWin(e))) + ')').join(' → ') : 'libero') + '</span>' +
    x.issues.map(i => '<p class="note ' + (i.level === 'bad' ? 'bad' : 'warn') + '">' + esc(i.text) + '</p>').join('') + '</li>').join('') + '</ul>';
  const sh = dayShared(date);
  h += '<h3 class="dsec">Materiale richiesto da più eventi</h3>';
  if (!sh.length) h += '<p class="note muted">Nessun articolo del magazzino è richiesto da due eventi.</p>';
  else h += '<ul class="dayl">' + sh.map(x => '<li class="col"><b>' + esc(x.m.nome) + '</b><span class="dsub">' +
    x.users.map(u => esc(u.e.cliente) + ' ' + (u.q < 0 ? '−' + (-u.q) : u.q)).join(' + ') + ' = ' + x.sum + ' · ne hai ' + x.stock + (x.locked ? ' sciolti (e ' + x.locked + ' nei case)' : ' utilizzabili') + '</span>' +
    (x.short > 0 ? '<p class="note bad">Mancano ' + x.short + (S.reuseSame && x.need < x.sum ? ' (contando che alcuni eventi usano gli stessi pezzi uno dopo l\'altro)' : '') + '.</p>'
      : (x.need < x.sum ? '<p class="note ok">Bastano: gli eventi si susseguono e usano gli stessi pezzi.</p>' : '<p class="note ok">Bastano.</p>')) + '</li>').join('') + '</ul>';
  h += '<label class="chk dreuse"><input type="checkbox" data-chg="reuseSame"' + (S.reuseSame ? ' checked' : '') + '> Due eventi uno dopo l\'altro possono usare gli stessi pezzi</label>' +
    '<p class="hint">Vale se tutti e due hanno gli orari indicati (dal primo arrivo alla fine smontaggio, o alla fine evento) e non si sovrappongono: ' +
    'se uno finisce alle 18:00 e l\'altro deve essere in location alle 18:30, i pezzi in comune ci sono per tutti e due. ' +
    'Se gli orari si sovrappongono, o ne manca uno, il pezzo si conta per tutti e due.</p>';
  return h + '<div class="sheetfoot"><button type="button" class="btn pri" data-act="closeSheet">Fatto</button></div>';
}

   COORDINATORE - magazzino: entrate e uscite, guasti e riparazioni, registro dei movimenti, inventario, furgoni;
   rimborsi ai tecnici
   ===================================================================== */
const REP_OPEN = ['da riparare', 'in riparazione'];
const REP_CLOSED = ['riparato', 'non riparabile'];
const MOV_IN = [['acquisto', 'Acquisto'], ['reso', 'Reso o rientro da prestito'], ['altro', 'Altro']];
const MOV_OUT = [['venduto', 'Venduto'], ['perso', 'Perso o rubato'], ['consumato', 'Consumato'], ['dismesso', 'Dismesso'],
  ['prestato', 'Prestato'], ['altro', 'Altro']];
const CAUSE_LABEL = { acquisto: 'Acquisto', reso: 'Reso', altro: 'Altro', venduto: 'Venduto', perso: 'Perso', consumato: 'Consumato',
  dismesso: 'Dismesso', prestato: 'Prestato', inventario: 'Inventario', 'modifica scheda': 'Modifica della scheda', 'nuovo articolo': 'Nuovo articolo' };
function causeLabel(c) { return CAUSE_LABEL[c] || cap(c); }
/* "2026-10-27 16:49" -> "27 ott 16:49" */
function fmtWhen(s) {
  const m = /^(\d{4}-\d{2}-\d{2})(?: (\d{2}:\d{2}))?$/.exec(String(s || '').trim());
  const p = m ? parseYMD(m[1]) : null;
  return p ? p.d + ' ' + MESI_B[p.m - 1] + (m[2] ? ' ' + m[2] : '') : String(s || '');
}

/* ---------- conti di magazzino ---------- */
/* Sotto scorta: i pezzi utilizzabili sono meno della scorta minima scritta nella scheda dell'articolo */
function isLow(m) {
  const min = toI(m.scortaMinima);
  return min > 0 && String(m.stato) !== 'dismesso' && stockOf(m) < min;
}
function openPieces(equipId) {
  return (S.ripByEq[equipId] || []).filter(r => REP_OPEN.indexOf(r.stato) >= 0).reduce((s, r) => s + toI(r.quantita), 0);
}
/* Pezzi fuori uso nella scheda dell'articolo che non hanno una riparazione aperta */
function orphanList() {
  return S.mat.filter(m => String(m.stato) !== 'dismesso').map(m => ({
    m: m, pieces: Math.max(0, Math.min(toI(m.quantita), toI(m.fuoriServizio)) - openPieces(m.id)),
  })).filter(o => o.pieces > 0);
}
function movShort(x) {
  const d = toSI(x.delta);
  return fmtWhen(x.quando) + ': ' + (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d) + ' · ' + causeLabel(x.causale) + (x.evento ? ' · ' + x.evento : '');
}
/* Dentro la scheda di un articolo aperto: riparazioni in corso e ultimi movimenti */
function stkExtraHtml(m) {
  let h = '';
  const open = (S.ripByEq[m.id] || []).filter(r => REP_OPEN.indexOf(r.stato) >= 0);
  if (open.length) {

  if (mv.length) h += '<div class="stkmv"><span class="k">Ultimi movimenti</span>' + mv.map(x => '<span>' + esc(movShort(x)) + '</span>').join('') + '</div>';

}

const T = { nome: '', ruoli: [], oggi: '', mie: [], recenti: [], annullati: [], piante: [], disp: {}, conf: {}, days: 30, saving: {}, q: {}, open: {}, tariffa: 0,
  resp: { fisso: false, nomine: [] }, page: 'mie' };   // resp = è responsabile tecnico? (spunta fissa e/o nomine per evento); page = 'mie' (le mie convocazioni) o 'resp' (l'area del responsabile)
/* Come si chiama la risposta del tecnico nella sua pagina (diversa dalla fase dell'evento, che è del cliente) */
const ASG_TECH = { 'in attesa': 'Da rispondere', confermato: 'Ci sei', rifiutato: 'Non puoi' };
const C = { data: null };

function linkErrorView(msg) {

/* Cosa si monta: il materiale dell'evento, con in cima il reparto del tecnico (un fonico cerca l'audio, chi fa luci le luci) */
function matBlock(e, lines, roles, defOpen) {
  if (!lines.length) return '<p class="nomat">Il materiale non è ancora stato inserito: quando c\'è lo trovi qui.</p>';
  const mine = ['generale'];
  roles.forEach(r => (ROLE_CATS[r] || []).forEach(c => { if (mine.indexOf(c) < 0) mine.push(c); }));
  const g = {};
  lines.forEach(l => { const k = catKey(l.categoria) || 'altro'; (g[k] = g[k] || []).push(l); });
  const keys = Object.keys(g).sort((a, b) => {
    const ma = mine.indexOf(a) >= 0 ? 0 : 1, mb = mine.indexOf(b) >= 0 ? 0 : 1;
    return ma - mb || cmpCat(a, b);
  });
  const some = keys.some(k => mine.indexOf(k) >= 0), others = keys.some(k => mine.indexOf(k) < 0);
  const pieces = lines.reduce((n, l) => n + (Number(l.quantita) || 0), 0);
  const open = e.id in T.open ? T.open[e.id] : !!defOpen;
  let h = '<details class="mat" data-mat="' + esc(e.id) + '"' + (open ? ' open' : '') + '><summary><span class="mt">Cosa si monta</span>' +
    '<span class="mc">' + lines.length + (lines.length === 1 ? ' voce' : ' voci') + ', ' + pieces + (pieces === 1 ? ' pezzo' : ' pezzi') + '</span></summary><div class="mbody">';
  if (STAGES_PROVVISORIE.indexOf(e.stato) >= 0) h += '<p class="hint" style="margin-top:0">Elenco provvisorio: può cambiare finché il cliente non conferma.</p>';
  keys.forEach(k => {
    const isMine = mine.indexOf(k) >= 0;
    h += '<h4 class="mcat' + (isMine && others && some ? ' mine' : '') + '">' + esc(catLabel(k)) +
      (isMine && others && some && k !== 'generale' ? '<small>il tuo reparto</small>' : '') + '</h4><ul class="ml">' +
      g[k].slice().sort((a, b) => String(a.nome).localeCompare(String(b.nome), 'it', { sensitivity: 'base' })).map(l => {
        const q = Number(l.quantita) || 0, sub = Math.min(q, Number(l.subnoleggio) || 0);
        const cs = caseSub(l), vt = variaTxt(l);
        return '<li><span class="lq">' + q + '</span><span class="ln">' + esc(l.nome) + (isCase(l) ? ' ' + CASE_PILL : '') +
          (l.note ? '<small>' + esc(l.note) + '</small>' : '') + (cs ? '<small class="cs">' + esc(cs) + '</small>' : '') +
          (vt ? '<small class="cs cvt">' + esc(vt) + '</small>' : '') + '</span>' +
          (sub ? '<span class="pill blue">' + (sub >= q ? 'tutto a noleggio' : sub + ' a noleggio') + '</span>' : '') + '</li>';
      }).join('') + '</ul>';
  });
  return h + '</div></details>';
}
document.addEventListener('toggle', ev => {   // "toggle" non risale: lo ascolto in fase di cattura
  const d = ev.target;
  if (d && d.matches && d.matches('details[data-mat]')) T.open[d.getAttribute('data-mat')] = d.open;
}, true);

/* La squadra dell'evento: tutti vedono chi lavora, con quali ruoli e chi ha già confermato (la riga con «tu» è la propria).
   Chi non guida il furgone e ha segnato «vado direttamente in location» lo si legge sotto il nome: così chi parte dal magazzino
   sa chi troverà già sul posto (e a che ora, se l'arrivo in location è scritto). e = l'evento, per quell'orario. */
function directTxt(e) {
  const arr = e && toMin(e.orarioArrivo) !== null ? ' · in location alle ' + hhmm(toMin(e.orarioArrivo)) : '';
  return 'Va direttamente in location' + arr;
}
function teamBlock(squadra, e) {
  if (!squadra || !squadra.length) return '';

    (nd ? ' · ' + nd + (nd === 1 ? ' va' : ' vanno') + ' direttamente in location' : '') + '</small></h4><ul>' +
    squadra.map(x => {
      const ok = x.stato === 'confermato';
      return '<li' + (x.tu ? ' class="you"' : '') + '><span class="tn">' + esc(x.nome) + (x.tu ? ' <em>(tu)</em>' : '') + '</span>' +
        '<span class="trole">' + uniq(rolesOf(x.ruoli)).map(r => '<span class="trc r-' + r + '">' + r + '</span>').join('') + '</span>' +

        '<span class="tstat ' + (ok ? 'ok' : 'muted') + '">' + (ok ? ico('check') + 'Confermato' : 'In attesa') + '</span>' +
        (x.diretto ? '<span class="tdir">' + ico('pin') + esc(directTxt(e)) + '</span>' : '') + '</li>';
    }).join('') + '</ul></div>';
}

/* Gli orari dell'evento non tornano con quello che il tecnico ha scritto di sé per quel giorno? Succede quando gli orari
   arrivano all'ultimo: lo deve sapere anche lui, non solo il coordinatore. disp = {on, from} oppure vuoto. */
function availIssues(e, disp, direct) {
  const out = [];
  if (!disp || e.stato === 'annullato') return out;
  if (!disp.on) {
    out.push({ level: 'bad', text: 'Per questo giorno avevi segnato che non sei disponibile, ma sei in squadra.' });
    return out;
  }
  const w = evWin(e, direct), f = toMin(disp.from);
  if (f !== null && w && w.s !== null && f > w.s) {
    out.push({ level: 'warn', text: 'Hai scritto che sei libero solo dalle ' + hhmm(f) + ', ma ' + startTxt(e, direct).replace(/^deve /, 'devi ') + '.' });
  }
  return out;
}
function availWarnHtml(e, disp, canFix, direct) {
  const list = availIssues(e, disp, direct);
  if (!list.length) return '';
  return '<div class="banner availwarn' + (list[0].level === 'bad' ? ' bad' : '') + '" role="alert"><b>Gli orari non tornano con la tua disponibilità</b>' +
    list.map(i => '<span>' + esc(i.text) + '</span>').join('') +
    '<span class="avhow">' + (canFix ? 'Se è cambiato qualcosa correggila, e in ogni caso avvisa il coordinatore.' : 'Se non riesci a esserci in tempo, avvisa il coordinatore.') + '</span>' +
    (canFix ? '<button type="button" class="btn sm" data-act="goAvail" data-d="' + esc(e.data) + '">' + ico('cal') + ' Cambia la mia disponibilità</button>' : '') + '</div>';
}
ACT.goAvail = el => {
  const d = el.dataset.d, diff = dayNum(d) - dayNum(T.oggi);
  if (!(diff < T.days)) T.days = Math.min(180, Math.ceil((diff + 1) / 30) * 30);
  paint();
  const row = document.getElementById('d-' + d);
  if (row) {
    row.scrollIntoView({ block: 'center' });
    row.classList.add('flash');
    setTimeout(() => row.classList.remove('flash'), 3000);
  }
};

/* Furgoni dell'evento: quale, quale targa, chi guida (e se guidi tu) */
function vansBlock(vans) {
  if (!vans || !vans.length) return '';
  return '<div class="tvans" aria-label="Furgoni">' + vans.map(v => '<div class="tvan' + (v.tuo ? ' mine' : '') + '">' + ico('truck') +
    '<span><b>' + esc(v.nome) + '</b>' + (v.targa ? ' <small>' + esc(v.targa) + '</small>' : '') +
    '<small class="who">' + (v.tuo ? 'Guidi tu' : v.autista ? 'Guida ' + esc(v.autista) : 'Autista da decidere') + '</small></span></div>').join('') + '</div>';
}
/* Gli altri eventi dello stesso giorno in cui è convocato: se si pestano i piedi lo dice */
function sameDayHtml(m) {
  const e = m.evento;
  const others = T.mie.filter(o => o !== m && o.evento.data === e.data && o.assegnazione.stato !== 'rifiutato');
  return others.map(o => {
    const g = gapLevel(e, o.evento, directOf(m.assegnazione), directOf(o.assegnazione));
    return '<p class="note ' + (g ? (g.level === 'bad' ? 'bad' : 'warn') : 'muted') + '">Lo stesso giorno hai anche «' + esc(o.evento.cliente) + '» (' +
      esc(rangeTxt(evWin(o.evento, directOf(o.assegnazione)))) + ')' + (g ? ': ' + esc(g.why) : '') + '.</p>';
  }).join('');
}
function techExpBlock(m) {
  const list = (m.spese || []).slice().sort((a, b) => String(a.data).localeCompare(String(b.data)));
  let h = '<div class="texp"><h4 class="mcat">Le mie spese</h4>';
  if (!list.length) {
    h += '<p class="nomat" style="margin-top:4px">Hai anticipato carburante, pedaggi o pasti? Segnali qui: te li rimborsano.</p>';
  } else {
    h += '<ul class="exps">' + list.map(x => '<li><button type="button" class="exr" data-act="expEdit" data-ev="' + esc(m.evento.id) + '" data-id="' + esc(x.id) + '">' +
      '<span class="exm"><b>' + esc(expLabel(x.categoria)) + (x.descrizione ? '<span class="exd"> · ' + esc(x.descrizione) + '</span>' : '') + '</b>' +
      '<small>' + esc(fmtShort(x.data)) + (toN(x.km) ? ' · ' + esc(fmtNum(x.km, 1)) + ' km' : '') + '</small><span class="exp">' + expPill(x) + '</span></span>' +
      '<span class="exa">' + esc(fmtEur(x.importo)) + '</span></button></li>').join('') + '</ul>';
    const due = list.filter(x => x.pagatoDa === 'tecnico' && !x.rimborsatoIl).reduce((s, x) => s + toN(x.importo), 0);
    if (due) h += '<p class="extot"><span>Da rimborsare <b>' + esc(fmtEur(due)) + '</b></span></p>';
  }
  return h + '<div class="row" style="margin-top:8px"><button type="button" class="btn" data-act="expAdd" data-ev="' + esc(m.evento.id) + '">' + ico('plus') + ' Aggiungi spesa</button></div></div>';
}
/* Liste e spese compaiono quando servono: nei giorni intorno all'evento, o se c'è già qualcosa */
function techNeeds(m) {
  const diff = dayNum(m.evento.data) - dayNum(T.oggi), lines = m.materiale || [];
  const started = !!(m.liste && (m.liste.caricoQuando || m.liste.scaricoQuando)) || lines.some(l => toI(l.caricato) > 0);
  return {
    lists: lines.length > 0 && (diff <= 3 || started),
    exp: diff <= 1 || (m.spese || []).length > 0,
  };
}
function techListsBlock(m) {
  const lines = m.materiale || [];
  return '<div class="lbtns">' + listBtnHtml(m.evento, m.liste || {}, lines, 'carico') + listBtnHtml(m.evento, m.liste || {}, lines, 'scarico') + '</div>';
}

/* «Vado direttamente in location»: lo segnala chi non guida il furgone. Chi guida parte dal magazzino. */
function directBlock(e, a, extra) {
  if (!extra || !extra.token || a.stato === 'rifiutato') return '';
  const dir = directOf(a);
  if ((extra.vans || []).some(v => v.tuo)) return '<p class="direct note muted">' + ico('truck') + ' Guidi tu il furgone: parti dal magazzino.</p>';
  if (!dir && toMin(e.orarioMagazzino) === null && toMin(e.orarioPartenza) === null) return '';   // niente orari del magazzino: non c'è da scegliere
  return '<label class="chk direct"><input type="checkbox" data-chg="goDirect" data-token="' + esc(extra.token) + '"' + (dir ? ' checked' : '') +
    '> Non guido il furgone: vado direttamente in location</label>' +
    (dir ? '<p class="note muted direct">Ti aspettano in location all\'orario di arrivo. Lo vedono il coordinatore e il resto della squadra.</p>' : '');
}
CHG.goDirect = el => {
  const tok = el.dataset.token, on = el.checked;
  mutate(async () => {
    await call('api_setDirect', tok, on);
    if (S.mode === 'tech') { const m = T.mie.find(x => x.assegnazione.token === tok); if (m) m.assegnazione.direttoLocation = on; }
    else if (C.data) C.data.direttoLocation = on;
    paint();
    toast(on ? 'Segnato: vai direttamente in location.' : 'Segnato: parti dal magazzino.', 'ok');
  }).then(r => { if (!r.ok) paint(); });
};

/* scheda di una convocazione, uguale nella pagina personale e nella conferma rapida.
   m (facoltativo): la convocazione completa, per furgoni, liste e spese (solo nella pagina personale) */
function convBody(e, a, lines, defOpen, m, extra) {
  const roles = uniq(rolesOf(a.ruoli));
  const cancelled = e.stato === 'annullato';
  let h = '<div class="row"><span class="when">' + esc(fmtLong(e.data)) + '</span>' +
    (cancelled ? '' : '<span class="pill ' + (ASG_PILL[a.stato] || 'muted') + '" style="margin-left:auto">' + esc(ASG_TECH[a.stato] || a.stato) + '</span>') + '</div>' +
    '<h3>' + esc(e.cliente) + '</h3>' + stageBanner(e) +
    '<div class="row" style="margin-top:10px"><span class="muted">' + (cancelled ? 'Eri convocato come' : 'Ruolo') + '</span>' +
    roles.map(r => '<span class="chip r-' + r + '">' + r + '</span>').join('') + '</div>';
  if (cancelled) return h;
  const dir = directOf(a);
  h += timesHtml(e, dir) + directBlock(e, a, extra);
  if (extra && a.stato !== 'rifiutato') h += availWarnHtml(e, extra.disp, extra.canFix, dir);
  const facts = [];
  if (e.luogo) facts.push('<div><span class="k">Luogo: </span>' + esc(e.luogo) + '</div>');
  if (e.noteTecnici) facts.push('<div><span class="k">Note: </span>' + esc(e.noteTecnici) + '</div>');
  if (facts.length) h += '<div class="facts">' + facts.join('') + '</div>';
  if (extra) h += teamBlock(extra.squadra, e);
  h += matBlock(e, lines || [], roles, defOpen);
  if (m) {
    h += sameDayHtml(m) + vansBlock(m.furgoni);
    if (a.stato !== 'rifiutato') {
      const need = techNeeds(m);
      if (need.lists) h += techListsBlock(m);
      if (need.exp) h += techExpBlock(m);
    }
  }
  return h;
}
function respondButtons(a, act, tokenAttr) {
  const t = tokenAttr;
  if (a.stato === 'confermato') {
    return '<p style="margin-top:12px"><b>Hai confermato.</b> Se non puoi più venire, dillo qui sotto.</p>' +
      '<div class="btns"><button type="button" class="btn no" data-act="' + act + '" data-token="' + esc(t) + '" data-v="rifiutato" data-confirm="Sicuro? Tocca di nuovo">Non posso più</button></div>';
  }
  if (a.stato === 'rifiutato') {
    return '<p style="margin-top:12px"><b>Hai detto che non puoi.</b> Se hai cambiato idea, puoi ancora accettare.</p>' +
      '<div class="btns"><button type="button" class="btn go" data-act="' + act + '" data-token="' + esc(t) + '" data-v="confermato">Ora posso</button></div>';
  }
  return '<div class="btns"><button type="button" class="btn go big" data-act="' + act + '" data-token="' + esc(t) + '" data-v="confermato">Confermo</button>' +
    '<button type="button" class="btn no big" data-act="' + act + '" data-token="' + esc(t) + '" data-v="rifiutato">Non posso</button></div>';
}
function cardCls(st) { return st === 'confermato' ? 'confermato' : st === 'rifiutato' ? 'rifiutato' : 'pendente'; }

/* ---------- pagina personale ---------- */
function techView() {
  if (T.page === 'resp' && respIs()) return respView();
  let h = mastSimple('Pagina personale', '', true) + '<main class="wrap narrow main">';
  h += '<h1 class="hello">Ciao ' + esc(firstName(T.nome)) + '</h1>';
  h += '<div class="row" style="margin-top:10px">' + T.ruoli.map(r => '<span class="chip r-' + r + '">' + r + '</span>').join('') + '</div>';

  if (T.annullati.length) {
    h += '<section class="sec"><h2>Annullati</h2>';
    T.annullati.forEach(x => {
      h += '<article class="card annullato" id="ann-' + esc(x.evento.id) + '">' + convBody(x.evento, { ruoli: x.ruoli, stato: '' }) + '</article>';
    });

  }
  h += '<section class="sec"><h2>Convocazioni</h2>';

      (m.assegnazione.stato === 'rifiutato' ? '' : pjTechBtns(m.evento.id)) +

    h += '</section><section class="sec"><h2>Eventi appena passati</h2>';

  }
  h += '</section>' + pjTechSection() + '<section class="sec"><h2>Quando sei libero</h2>' +
    '<p class="hint" style="margin:10px 0 4px">Tocca <b>Sì</b> o <b>No</b> per ogni giorno, anche se non c\'è ancora nessun evento: il coordinatore vede subito chi c\'è. ' +
    'Se sei libero solo da una certa ora, scrivila. Per cancellare una risposta tocca di nuovo lo stesso pulsante.</p>' + availRows();
  if (T.days < 180) h += '<div style="margin-top:16px"><button type="button" class="btn" data-act="moreDays">Mostra altri 30 giorni</button></div>';
  h += '</section><p class="foot">Suggerimento: dal menu del browser scegli «Aggiungi a schermata Home», così la apri con un tocco.</p></main>';

/* Un evento già passato dove c'è ancora da fare qualcosa: scarico del furgone, spese da segnalare */
function recentCard(m) {
  const e = m.evento, lines = m.materiale || [];
  return '<article class="card recente" id="rec-' + esc(m.assegnazione.id) + '"><div class="row"><span class="when">' + esc(fmtLong(e.data)) + '</span>' +
    (m.liste && m.liste.scaricoQuando ? '<span class="pill ok" style="margin-left:auto">Scarico chiuso</span>' : '') + '</div>' +
    '<h3>' + esc(e.cliente) + '</h3>' + vansBlock(m.furgoni) +
    (lines.length ? techListsBlock(m) : '') + techExpBlock(m) + pjTechBtns(e.id) + '</article>';
}
function availRows() {
  const byDate = {};
  T.mie.forEach(m => { (byDate[m.evento.data] = byDate[m.evento.data] || []).push(m); });
  let h = '', lastMonth = -1;
  for (let i = 0; i < T.days; i++) {
    const d = addDays(T.oggi, i), p = parseYMD(d), w = wday(d);
    if (p.m !== lastMonth) { h += '<div class="monthsep">' + MESI[p.m - 1] + '</div>'; lastMonth = p.m; }
    const x = T.disp[d];
    const yes = !!(x && x.on), no = !!(x && !x.on);
    const conv = (byDate[d] || []).filter(m => m.assegnazione.stato !== 'rifiutato');
    h += '<div class="drow' + (w === 0 || w === 6 ? ' we' : '') + (T.saving[d] ? ' saving' : '') + '" id="d-' + d + '">' +
      '<div class="dc"><b>' + p.d + '</b><span>' + GIORNI_B[w] + '</span></div>' +
      '<div class="tgs"><button type="button" class="tg yes' + (yes ? ' on' : '') + '" data-act="av" data-d="' + d + '" data-v="1" aria-pressed="' + yes + '" aria-label="Libero, ' + esc(fmtShort(d)) + '">' + (yes ? ico('check') : '') + 'Sì</button>' +
      '<button type="button" class="tg no' + (no ? ' on' : '') + '" data-act="av" data-d="' + d + '" data-v="0" aria-pressed="' + no + '" aria-label="Non disponibile, ' + esc(fmtShort(d)) + '">' + (no ? ico('x') : '') + 'No</button></div>';
    if (yes || conv.length) {
      h += '<div class="more">';
      if (yes) h += '<label>Libero dalle <input type="time" data-chg="avFrom" data-d="' + d + '" value="' + esc(inputT(x.from)) + '" aria-label="Libero dalle ore, ' + esc(fmtShort(d)) + '"></label>';
      conv.forEach(m => { h += '<span class="conv">Convocato: ' + esc(m.evento.cliente) + '</span>'; });
      h += '</div>';
    }
    h += '</div>';
  }
  return h;
}

/* Salva la risposta di un giorno. Le chiamate dello stesso giorno vanno in fila, così l'ordine è quello dei tocchi. */
function saveDay(d, value, from) {
  T.saving[d] = (T.saving[d] || 0) + 1;
  const prev = T.q[d] || Promise.resolve();
  T.q[d] = prev.then(() => call('api_techSetAvailability', S.token, d, value, from || ''))
    .then(() => {
      if (value === null) delete T.conf[d]; else T.conf[d] = { on: value, from: from || '' };
    })
    .catch(e => {
      if (T.conf[d]) T.disp[d] = { on: T.conf[d].on, from: T.conf[d].from }; else delete T.disp[d];
      toast(e.message, 'err');
    })
    .then(() => { T.saving[d] -= 1; if (!T.saving[d]) delete T.saving[d]; paint(); });
}
ACT.av = el => {
  const d = el.dataset.d, want = el.dataset.v === '1';
  const prev = T.disp[d];
  const next = (prev && prev.on === want) ? null : want;
  if (next === null) delete T.disp[d]; else T.disp[d] = { on: next, from: '' };
  saveDay(d, next, '');
  paint();
};
CHG.avFrom = el => {
  const d = el.dataset.d, x = T.disp[d];
  if (!x || !x.on) return;
  x.from = inputT(el.value);
  saveDay(d, true, x.from);
  paint();
};
ACT.moreDays = () => { T.days = Math.min(180, T.days + 30); paint(); };
ACT.respond = el => {
  const tok = el.dataset.token, v = el.dataset.v;
  mutate(async () => {
    await call('api_respond', tok, v);
    const m = T.mie.find(x => x.assegnazione.token === tok);
    if (m) m.assegnazione.stato = v;
    paint();
    toast(v === 'confermato' ? 'Confermato, grazie!' : 'Ricevuto: ho segnato che non puoi.', 'ok');
  });
};
ACT.techRefresh = async () => {
  try {
    await techLoad();
    if (RS.loaded) await respLoad();
    if (PJ.list !== null) { await pjLoad(); pjRepaint(); }   // l'elenco delle piante, se l'avevi aperto
    toast('Aggiornato.', 'ok');
  } catch (e) { toast(e.message, 'err'); }
};
async function techLoad() {
  const d = await call('api_techInit', S.token);
  T.nome = d.tecnico.nome; T.ruoli = uniq(rolesOf(d.tecnico.ruoli)); T.oggi = d.oggi; T.mie = d.mie; T.annullati = d.annullati || [];
  T.recenti = d.recenti || []; T.tariffa = toN(d.tariffa_km); T.piante = d.piante || [];
  T.resp = { fisso: !!(d.resp && d.resp.fisso), nomine: (d.resp && d.resp.nomine) || [] };
  if (!respIs()) { T.page = 'mie'; RS.loaded = false; }
  S.cfg = Object.assign(S.cfg || {}, { durata_evento_ore: d.durata_evento_ore || 4 });
  T.disp = {}; T.conf = {};
  d.disponibilita.forEach(x => {
    T.disp[x.data] = { on: isTrue(x.disponibile), from: String(x.oraDa || '') };
    T.conf[x.data] = { on: T.disp[x.data].on, from: T.disp[x.data].from };
  });
  paint();
}
async function techBoot() {

document.addEventListener('visibilitychange', () => {

/* =====================================================================
   PROGETTI - le piante degli eventi (4.0)
   Elenco, nuovo, copia, storico, cestino e apertura dell'editor (pianta.html, sulla pagina GitHub).
   Lo usano il coordinatore (scheda Progetti e pannello dell'evento) e i tecnici (convocazioni e sezione Piante).
   I dati stanno nel Foglio (api_pj... in progetti.gs); qui non si disegna niente: la pianta si disegna nell'editor.
   ===================================================================== */
const PJ = { list: null, gaps: [], page: true, err: '', loading: null, q: '', filt: 'tutti' };
const PJ_FILT = [['tutti', 'Tutti'], ['eventi', 'Con evento'], ['liberi', 'Senza evento'], ['modelli', 'Modelli']];
const PJ_MAX_FILE = 4000000;   // caratteri di un progetto (come sul server)
const PJ_ORIG_HINT = {
  vuoto: 'Una pianta vuota, da disegnare.',
  copia: 'Si parte da un progetto già fatto: lo copi e lo modifichi, l\'originale resta com\'è.',
  modello: 'Si parte dal modello salvato per quell\'artista: lo copi e lo adatti al posto.',
  file: 'Un file salvato con «Scarica il file», il file .json dell\'editor della pianta, oppure un archivio con più progetti.',
};

/* ---------- chi sei, cosa c'è ---------- */
function pjAuth() { return S.mode === 'tech' ? { t: S.token } : { pin: S.pin }; }
function pjCoord() { return S.mode === 'coord'; }
/* Chi può portare il materiale di una pianta in un evento: il coordinatore e i tecnici responsabili (nei limiti dei loro reparti: lo controlla anche il server) */
function pjCanUse() { return S.mode === 'coord' || (S.mode === 'tech' && typeof respIs === 'function' && respIs()); }
function pjById(id) { return (PJ.list || []).filter(p => p.id === id)[0] || null; }
function pjLive() { return (PJ.list || []).filter(p => !p.cestino); }
function pjNorm(s) { return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function pjSort() { PJ.list.sort((a, b) => String(b.modificato).localeCompare(String(a.modificato))); }
function pjPut(p) { if (!PJ.list) PJ.list = []; upsert(PJ.list, p); pjSort(); }
function pjReset() { PJ.list = null; PJ.gaps = []; PJ.err = ''; PJ.loading = null; PJ.q = ''; PJ.filt = 'tutti'; }

/* Le piante di un evento: l'elenco completo se è già stato caricato, altrimenti quello che il server manda con la pagina del tecnico */
function pjPlansFor(eventId) {
  const src = PJ.list !== null ? pjLive() : (S.mode === 'tech' ? (T.piante || []) : []);
  return src.filter(p => p.event_id === eventId && (p.tipo === undefined || p.tipo === 'progetto'));
}

/* ---------- caricamento ---------- */
/* Non fallisce mai: se qualcosa va storto lascia il messaggio in PJ.err */
function pjLoad() {
  if (PJ.loading) return PJ.loading;
  PJ.loading = call('api_pjList', pjAuth())
    .then(r => { PJ.list = r.progetti || []; PJ.gaps = r.mancano || []; PJ.page = !!r.pagina; PJ.err = ''; })
    .catch(e => { PJ.err = e.message; })
    .then(() => { PJ.loading = null; });
  return PJ.loading;
}
/* Ridisegna la pagina dopo un caricamento. Se chi usa sta scrivendo nella ricerca, cambio solo l'elenco: così il cursore resta dov'è. */
function pjRepaint() {
  if (typeof S.view !== 'function') return;
  if (S.mode === 'coord' && !S.ready) return;
  const a = document.activeElement;
  if (a && a.id === 'pjq') { const b = $('#pjlist'); if (b) b.innerHTML = pjListHtml(); return; }
  paint();
}
ACT.pjRetry = () => { PJ.err = ''; paint(); };

/* ---------- la scheda Progetti ---------- */
function viewProg() {
  if (PJ.list === null) {
    if (!PJ.loading && !PJ.err) pjLoad().then(pjRepaint);
    if (PJ.err) return pjErrHtml();
    return '<p class="empty">Carico i progetti…</p>';
  }
  return pjBodyHtml();
}
function pjErrHtml() {
  return '<div class="pageerr" role="alert"><h2>Non riesco a caricare i progetti</h2><p>' + esc(PJ.err) + '</p>' +
    '<div class="row" style="margin-top:12px"><button type="button" class="btn pri" data-act="pjRetry">Riprova</button></div></div>';
}
/* Il contenuto (avvisi, pulsanti, ricerca, elenco): lo stesso per il coordinatore e per il tecnico */
function pjBodyHtml() {
  const co = pjCoord();
  if (PJ.gaps.length) {

/* ---------- aprire la pianta ---------- */
/* La pianta si apre in una scheda nuova. Il telefono blocca le schede aperte "dopo", fuori dal tocco: per questo la apro subito, vuota
   (dentro il tocco), e solo quando il server ha risposto ci metto l'indirizzo. */
function pjBlankWin() {
  let w = null;
  try { w = window.open('', '_blank'); } catch (e) { w = null; }
  if (w) {
    try { w.opener = null; } catch (e) { /* ok */ }
    try {
      w.document.title = 'Apro la pianta…';
      w.document.body.style.cssText = 'font:18px system-ui,sans-serif;padding:24px';
      w.document.body.textContent = 'Apro la pianta…';
    } catch (e) { /* ok */ }
  }
  return w;
}
function pjCloseWin(w) { if (w) { try { w.close(); } catch (e) { /* ok */ } } }
function pjGo(w, url) {
  if (w && !w.closed) {
    try { w.location.replace(url); return; } catch (e) { /* passo al pulsante */ }
  }
  openSheet('Apri la pianta', '<p>Il telefono non ha aperto da solo la nuova scheda. Tocca il pulsante qui sotto.</p>' +
    '<div class="sheetfoot"><button type="button" class="btn" data-act="closeSheet">Chiudi</button>' +
    '<a class="btn pri" href="' + esc(url) + '" target="_blank" rel="noopener" data-act="closeSheet">Apri la pianta</a></div>', { noFocus: true });
}
async function pjOpenPlan(id, w) {
  try {
    const r = await call('api_pjHandoff', pjAuth(), id);
    pjGo(w, r.url);
  } catch (e) {
    pjCloseWin(w);
    toast(e.message, 'err');
  }
}

function pjReadFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result || ''));
    r.onerror = () => reject(new Error('Non riesco a leggere il file.'));
    r.readAsText(file);
  });
}
/* Legge il file scelto e lo riconosce: un progetto solo (anche quello dell'editor) oppure un archivio con più progetti */
async function pjReadPack(file) {
  if (file.size > 80 * 1024 * 1024) throw new Error('Il file è troppo grande.');
  const text = await pjReadFile(file);
  let d = null;
  try { d = JSON.parse(text); } catch (e) { d = null; }
  if (!d || typeof d !== 'object' || Array.isArray(d)) {
    throw new Error('Questo file non è un progetto: scegli un file scaricato da qui con «Scarica il file», o salvato dall\'editor della pianta.');
  }
  return { text: text, d: d };
}
/* Le immagini di un pacchetto: le carico una per volta (quelle già mandate in questo giro non si rimandano) */
async function pjSendImages(imgs, sent, say) {
  imgs = Array.isArray(imgs) ? imgs : [];
  for (let i = 0; i < imgs.length; i++) {
    const im = imgs[i] || {}, id = String(im.id || '');
    if (sent && sent[id]) continue;
    if (say) say('Carico le immagini (' + (i + 1) + ' di ' + imgs.length + ')…');
    await call('api_pjImgPut', pjAuth(), id, String(im.tipo || ''), String(im.nome || ''), String(im.b64 || ''));
    if (sent) sent[id] = true;
  }
}
/* Prepara la richiesta per un progetto solo. Un pacchetto «gestionale-pianta» porta con sé anche le immagini di sfondo: le carico prima. */
async function pjPrepareFile(rd, o) {
  const d = rd.d;
  if (d.formato === 'gestionale-pianta') {
    if (!d.doc || typeof d.doc !== 'object' || Array.isArray(d.doc)) throw new Error('Nel file non c\'è il progetto.');
    await pjSendImages(d.immagini, null, m => toast(m));
    if (!o.nome) o.nome = String(d.nome || '');
    if (!o.artista) o.artista = String(d.artista || '');
    o.json = JSON.stringify(d.doc);
  } else {
    o.json = rd.text;
  }
  if (o.json.length > PJ_MAX_FILE) throw new Error('Il progetto è troppo grande per il foglio.');
}
SUB.pjNew = async form => {
  const f = new FormData(form), err = $('.ferr', form);
  const orig = String(f.get('origine') || 'vuoto');
  const o = { nome: String(f.get('nome') || '').trim(), tipo: String(f.get('tipo')) === 'modello' ? 'modello' : 'progetto',
    artista: String(f.get('artista') || '').trim(), event_id: String(f.get('event_id') || '') };
  if (o.tipo === 'modello') o.event_id = '';
  let file = null;
  if (orig === 'copia' || orig === 'modello') {
    o.daId = String(f.get(orig === 'copia' ? 'daId' : 'modId') || '');
    if (!o.daId) { err.textContent = orig === 'copia' ? 'Scegli il progetto da copiare.' : 'Scegli il modello.'; return; }
  } else if (orig === 'file') {
    file = f.get('file');
    if (!file || !file.size) { err.textContent = 'Scegli il file del progetto.'; return; }
  }
  err.textContent = '';
  const go = f.get('apri') !== null;
  const win = go ? pjBlankWin() : null;
  let created = null, arch = null;
  const r = await mutate(async () => {
    if (file) {
      const rd = await pjReadPack(file);
      if (pjIsArchive(rd.d)) { await pjArchivePrepare(rd.d); arch = rd.d; return; }      // più progetti in un file: si sceglie dopo cosa importare
      await pjPrepareFile(rd, o);
    }
    created = await call('api_pjCreate', pjAuth(), o);
    pjPut(created);
    closeSheet();
    paint();
    toast('Progetto creato: ' + created.nome + '.', 'ok');
  }, true);
  if (!r.ok) { err.textContent = r.err; pjCloseWin(win); return; }
  if (arch) { pjCloseWin(win); pjArchiveSheet(arch); return; }
  if (go && created) await pjOpenPlan(created.id, win);
};

/* ---------- un archivio: più progetti (e il catalogo) in un file solo ---------- */
/* Il file lo prepara chi cambia strumento (per esempio dal vecchio «Planimetria Evento»): {formato:'gestionale-pianta-archivio', progetti:[pacchetti], catalogo:{doc, immagini}}.
   Ogni pacchetto è quello di «Scarica il file». Si sceglie cosa importare; i progetti entrano come nuovi, non sostituiscono niente. */
let PJ_ARCH = null;    // l'archivio scelto: sta in memoria finché la finestra è aperta
function pjIsArchive(d) { return !!d && d.formato === 'gestionale-pianta-archivio'; }
const pjIsObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
const pjCount = x => Array.isArray(x) ? x.length : (pjIsObj(x) ? Object.keys(x).length : 0);
function pjPackName(pk) { return String(pk.nome || (pjIsObj(pk.doc.meta) && pk.doc.meta.nome) || 'Progetto importato').replace(/\s+/g, ' ').trim().slice(0, 120); }
/* Tiene solo quello che si può importare e guarda se c'è già un catalogo (importarlo lo sostituirebbe). Se non c'è niente di buono, errore. */
async function pjArchivePrepare(d) {
  d.progetti = (Array.isArray(d.progetti) ? d.progetti : []).filter(p => pjIsObj(p) && pjIsObj(p.doc));
  if (!pjIsObj(d.catalogo) || !pjIsObj(d.catalogo.doc)) d.catalogo = null;
  if (!d.progetti.length && !d.catalogo) throw new Error('Nell\'archivio non c\'è niente da importare.');
  d.catEsiste = false;
  if (d.catalogo) {
    try { const r = await call('api_pjLoad', pjAuth(), '_catalogo'); d.catEsiste = !!(r && r.exists); } catch (e) { d.catEsiste = true; }   // se non riesco a controllare, meglio non sostituire
  }
}
function pjArchSub(pk) {
  const m = pjIsObj(pk.doc.meta) ? pk.doc.meta : {}, parts = [];
  parts.push(pk.tipo === 'modello' ? 'Modello' + (pk.artista ? ' di ' + pk.artista : '') : (pk.artista || 'Progetto'));
  if (m.data) parts.push(fmtShort(m.data));
  if (m.location) parts.push(m.location);
  parts.push(plural(pjCount(pk.doc.S), 'elemento', 'elementi'));
  if (pk.salvato) parts.push('salvato ' + fmtWhen(pk.salvato));
  return parts.map(esc).join(' · ');
}
function pjArchCatSub(c) {
  const k = c.doc, parts = [];
  if (pjCount(k.items)) parts.push(plural(pjCount(k.items), 'attrezzatura tua', 'attrezzature tue'));
  if (pjCount(k.ovr)) parts.push(plural(pjCount(k.ovr), 'correzione', 'correzioni'));
  if (pjCount(k.specs)) parts.push(plural(pjCount(k.specs), 'cavo tuo', 'cavi tuoi'));
  if (pjCount(k.stock)) parts.push('scorte');
  const man = pjIsObj(k.docs) ? Object.keys(k.docs).reduce((t, key) => t + pjCount(k.docs[key]), 0) : 0;
  if (man) parts.push(plural(man, 'manuale', 'manuali'));
  return parts.join(' · ') || 'Attrezzature, scorte e manuali';
}
/* La lista con le caselle. Quello che è già stato importato non c'è più: se qualcosa è andato storto resta solo il resto, per riprovare. */
function pjArchiveSheet(d, note) {
  PJ_ARCH = d;
  const todo = d.progetti.map((p, i) => ({ p: p, i: i })).filter(x => !x.p.fatto);
  const cat = d.catalogo && !d.catalogo.fatto ? d.catalogo : null;
  let h = note || '';
  h += '<form data-submit="pjArch" novalidate><p class="hint" style="margin:0 0 6px">' + (note ? 'Quello che resta:' :

      (d.catEsiste ? '<small class="warn">Un catalogo c\'è già: importando questo lo sostituisci (la versione di adesso resta tra quelle salvate).</small>' : '') + '</span></label>';
  }
  h += '<p class="pjprog" role="status" aria-live="polite"></p><p class="ferr" role="alert"></p>' +
    '<div class="sheetfoot sticky"><button type="button" class="btn" data-act="closeSheet">Annulla</button><button type="submit" class="btn pri">' + (note ? 'Riprova' : 'Importa') + '</button></div></form>';
  openSheet('Importa dall\'archivio', h, { noFocus: true });

SUB.pjArch = async form => {
  const d = PJ_ARCH, err = $('.ferr', form);
  if (!d) { closeSheet(); return; }
  const f = new FormData(form);
  const picks = f.getAll('i').map(v => parseInt(v, 10)).filter(i => d.progetti[i] && !d.progetti[i].fatto);
  const withCat = f.get('cat') !== null && !!d.catalogo && !d.catalogo.fatto;
  if (!picks.length && !withCat) { err.textContent = 'Scegli almeno una cosa da importare.'; return; }
  err.textContent = '';
  const say = m => { const el = $('.pjprog', form); if (el) el.textContent = m; };
  const total = picks.length + (withCat ? 1 : 0), sent = {}, failed = [];
  let n = 0, okP = 0, okC = false;
  const r = await mutate(async () => {
    for (const i of picks) {
      const pk = d.progetti[i], nome = pjPackName(pk);
      n++;
      const head = 'Importo ' + n + ' di ' + total + ': ' + nome + ' · ';
      try {
        await pjSendImages(pk.immagini, sent, m => say(head + m));
        const o = { nome: nome, tipo: pk.tipo === 'modello' ? 'modello' : 'progetto', artista: String(pk.artista || '').trim().slice(0, 80), json: JSON.stringify(pk.doc) };
        if (o.json.length > PJ_MAX_FILE) throw new Error('è troppo grande per il foglio');
        say(head + 'salvo…');
        pjPut(await call('api_pjCreate', pjAuth(), o));
        pk.fatto = true; okP++;
      } catch (e) { failed.push('«' + nome + '»: ' + e.message); }
    }
    if (withCat) {
      n++;
      const head = 'Importo ' + n + ' di ' + total + ': catalogo · ';
      try {
        await pjSendImages(d.catalogo.immagini, sent, m => say(head + m));
        say(head + 'salvo…');
        const json = JSON.stringify(d.catalogo.doc);
        if (json.length > PJ_MAX_FILE) throw new Error('è troppo grande per il foglio');
        await call('api_pjSave', pjAuth(), '_catalogo', -1, json, '');
        d.catalogo.fatto = true; okC = true;
      } catch (e) { failed.push('catalogo: ' + e.message); }
    }
  }, true);
  if (!r.ok) { err.textContent = r.err; return; }
  PJ.q = ''; PJ.filt = 'tutti';
  const done = [okP ? plural(okP, 'progetto', 'progetti') : '', okC ? 'il catalogo' : ''].filter(Boolean).join(' e ');
  if (!failed.length) {
    closeSheet(); paint();
    toast('Importati: ' + done + '.', 'ok');
    return;
  }
  paint();
  pjArchiveSheet(d, '<p class="note ok">' + (done ? 'Importati: ' + esc(done) + '.' : 'Non ho importato niente.') + '</p>' +
    '<p class="note bad" role="alert">Non sono riuscito a importare ' + failed.map(esc).join(' · ') + '</p>');
};

function pjDownload(name, text) {

  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';

/* =====================================================================
   DALLA PIANTA AL MAGAZZINO E ALL'EVENTO (4.0, tappa 2)
   - «Usa il materiale»: porta nell'elenco di un evento il materiale di una pianta e controlla cosa è libero in magazzino
   - «Dalla pianta» (scheda Magazzino): crea o aggiorna gli articoli partendo dalle scorte scritte nel catalogo della pianta
   - «Duplica evento»: un evento che si ripete, con il suo materiale e le sue piante
   Il lavoro vero lo fanno api_pjUse, api_pjStockLoad e api_pjDupEvent (progetti.gs): qui si sceglie e si controlla.
   Solo per il coordinatore. Le disponibilità si calcolano con le funzioni dell'evento (availFor, ownNet, fromStock): stessi conti.
   ===================================================================== */

/* ---------- confronto dei nomi: «Cavo XLR 10 m» e «XLR 10mt» sono lo stesso articolo ---------- */
const PU_STOP = { di: 1, da: 1, del: 1, della: 1, dei: 1, delle: 1, con: 1, per: 1, e: 1, il: 1, la: 1, le: 1, lo: 1, un: 1, una: 1, in: 1, tipo: 1 };
const PU_SKIP = /^fornito da/i;          // «Fornito da: artista»: non è materiale nostro
const PU_JOINT = /^giunti tra cavi/i;    // un conteggio, non un pezzo da portare
function puTokens(s) {
  const t = pjNorm(s).replace(/[^a-z0-9]+/g, ' ').replace(/([a-z])(\d)/g, '$1 $2').replace(/(\d)([a-z])/g, '$1 $2');
  const out = [];
  t.split(' ').forEach(w0 => {
    let w = w0;
    if (!w) return;
    if (w === 'mt' || w === 'mts' || w === 'metri' || w === 'metro') w = 'm';
    if (PU_STOP[w]) return;
    out.push(w);
  });
  return out;
}
/* Il nome com'è nel foglio (stessa pulizia del server) */
function puName(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, 120); }
function puQ(q) { q = Number(q) || 0; return Number.isInteger(q) ? String(q) : String(Math.round(q * 10) / 10).replace('.', ','); }
/* La categoria del magazzino (audio, luci, video, generale) per una categoria dell'elenco della pianta */
function puWhCat(c) {
  const s = pjNorm(c);
  if (/^cavi/.test(s)) return /audio/.test(s) ? 'audio' : /dmx/.test(s) ? 'luci' : /video/.test(s) ? 'video' : 'generale';
  if (/^audio|^strumenti/.test(s)) return 'audio';
  if (/^luci/.test(s)) return 'luci';
  if (/^video/.test(s)) return 'video';
  return 'generale';
}
/* Due parole uguali, o quasi: due lettere scambiate (xrl / xlr), una sbagliata o una in più nelle parole lunghe. I numeri devono essere identici. */
function puTokEq(x, y) {
  if (x === y) return true;
  if (/^\d+$/.test(x) || /^\d+$/.test(y)) return false;
  const lx = x.length, ly = y.length;
  if (Math.min(lx, ly) < 3) return false;
  if (lx === ly) {
    const d = [];
    for (let i = 0; i < lx; i++) if (x[i] !== y[i]) d.push(i);
    if (d.length === 2 && d[1] === d[0] + 1 && x[d[0]] === y[d[1]] && x[d[1]] === y[d[0]]) return true;
    return d.length === 1 && lx >= 5;
  }
  if (Math.abs(lx - ly) === 1 && Math.min(lx, ly) >= 5) {
    const s = lx < ly ? x : y, l = lx < ly ? y : x;
    for (let i = 0; i < l.length; i++) if (l.slice(0, i) + l.slice(i + 1) === s) return true;
  }
  return false;
}
/* Quanto due elenchi di parole si somigliano. Se tutti e due hanno dei numeri e non sono gli stessi (10 m e 5 m) non sono lo stesso articolo. */
function puSim(a, b) {
  if (!a.length || !b.length) return null;
  const na = a.filter(w => /^\d+$/.test(w)).sort().join(','), nb = b.filter(w => /^\d+$/.test(w)).sort().join(',');
  if (na && nb && na !== nb) return null;
  const ua = uniq(a), ub = uniq(b), used = {};
  let sh = 0;
  ua.forEach(x => {
    for (let i = 0; i < ub.length; i++) {
      if (!used[i] && puTokEq(x, ub[i])) { used[i] = 1; sh++; return; }
    }
  });
  return { sh: sh, j: sh / (ua.length + ub.length - sh), ov: sh / Math.min(ua.length, ub.length) };
}
/* Gli articoli tra cui cercare (i case no: un pezzo della pianta non è un case) */
function puArts() {
  return S.mat.filter(m => String(m.stato) !== 'dismesso' && !isCase(m)).map(m => { const tok = puTokens(m.nome); return { m: m, tok: tok, norm: tok.join(' ') }; });
}
/* Trova l'articolo del magazzino che somiglia a una voce: «esatto» (stesso nome) o «forse» (da controllare) */
function puFind(tok, norm, arts) {
  if (!tok.length) return null;
  let best = null;
  for (let i = 0; i < arts.length; i++) {
    const x = arts[i];
    if (x.norm === norm) return { m: x.m, kind: 'esatto' };
    const s = puSim(tok, x.tok);
    if (!s || s.sh < 2) continue;
    if (!(s.j >= 0.5 || (s.ov >= 0.8 && s.sh >= 3))) continue;
    if (!best || s.j > best.j || (s.j === best.j && s.ov > best.ov)) best = { m: x.m, kind: 'forse', j: s.j, ov: s.ov };
  }
  return best;
}
/* Come la voce della pianta si lega a un articolo: prima quello già scelto altre volte, poi il nome uguale, poi il più somigliante */
function puLink(x, mappa, arts) {
  const tok = puTokens(x.i), norm = tok.join(' ');
  const key = x.k ? 'k:' + x.k : 'n:' + norm;
  const out = { key: key, eq: '', how: 'libera' };
  if (Object.prototype.hasOwnProperty.call(mappa, key)) {
    const id = mappa[key], m = id ? S.matById[id] : null;
    if (id === '') { out.how = 'mappa'; return out; }
    if (m && String(m.stato) !== 'dismesso') { out.eq = id; out.how = 'mappa'; return out; }
  }
  const f = puFind(tok, norm, arts);
  if (f) { out.eq = f.m.id; out.how = f.kind; }
  return out;
}
/* Le opzioni per scegliere un articolo del magazzino */

  const cats = uniq(items.map(m => catKey(m.categoria) || 'generale')).sort(cmpCat);
  return '<option value="">' + esc(noneLabel) + '</option>' + cats.map(c =>
    '<optgroup label="' + esc(catLabel(c)) + '">' + items.filter(m => (catKey(m.categoria) || 'generale') === c).map(m =>
      '<option value="' + esc(m.id) + '"' + (m.id === sel ? ' selected' : '') + '>' + esc(m.nome + (m.marca ? ' · ' + m.marca : '')) + '</option>').join('') + '</optgroup>').join('');
}

/* =====================================================================
   «USA IL MATERIALE DELLA PIANTA» (dentro un evento)
   ===================================================================== */
let PU = null;      // la finestra aperta: {pid, e, ctx, rows, skip, joint, only}
const PJM = {};     // l'elenco già letto in questa pagina, per ogni progetto: {rev, ctx}
const PJM_LOADING = {};

/* La riga dell'evento a cui corrisponde una voce della pianta (quella di quell'articolo, o quella scritta a mano con lo stesso nome) */
function puEvLine(e, r) {
  const lines = S.carByEv[e.id] || [];
  if (r.eq) return lines.filter(c => c.equipment_id === r.eq)[0] || null;
  const nm = puName(r.item).toLowerCase();
  return lines.filter(c => !c.equipment_id && String(c.materiale).trim().toLowerCase() === nm)[0] || null;
}
/* Le voci della pianta messe a confronto con l'elenco dell'evento */
function puBuild(ctx, e) {
  const arts = puArts(), mappa = ctx.mappa || {}, lines = S.carByEv[e.id] || [];
  const rows = [], skip = [], joint = [];
  (Array.isArray(ctx.righe) ? ctx.righe : []).forEach(x => {
    const cat = String(x.c || ''), item = String(x.i || ''), q = Number(x.q) || 0;
    if (!item || q <= 0) return;
    if (PU_SKIP.test(cat)) { skip.push({ cat: cat, item: item, q: q }); return; }
    if (PU_JOINT.test(item)) { joint.push({ cat: cat, item: item, q: q }); return; }
    const l = puLink({ i: item, k: x.k }, mappa, arts);
    const r = { n: rows.length, cat: cat, dept: deptPlan(cat), item: item, q: q, qty: Math.max(1, Math.ceil(q - 1e-9)), key: l.key, eq: l.eq, how: l.how, on: false, evQ: 0, st: 'new' };
    const cur = puEvLine(e, r);
    r.evQ = cur ? Number(cur.quantita) || 0 : 0;
    r.st = !cur ? 'new' : (r.evQ === r.qty ? 'same' : 'diff');
    r.on = (r.st === 'new' || (r.st === 'diff' && r.qty > r.evQ)) && r.how !== 'forse';
    rows.push(r);
  });
  const used = {};
  rows.forEach(r => { const c = puEvLine(e, r); if (c) used[c.id] = true; });
  return { rows: rows, skip: skip, joint: joint, only: lines.filter(c => !used[c.id]) };
}
/* Quanti pezzi chiederebbe l'evento al magazzino scegliendo queste voci, e quanti ne mancherebbero */
function puCalc() {
  const e = PU.e, out = { arts: {}, short: 0, shortArts: 0, n: 0 };
  PU.rows.forEach(r => {
    if (!r.on) return;
    out.n++;
    if (!r.eq || !S.matById[r.eq]) return;
    const g = out.arts[r.eq] = out.arts[r.eq] || { m: S.matById[r.eq], add: 0 };
    g.add += r.qty;
  });
  Object.keys(out.arts).forEach(id => {
    const g = out.arts[id], cur = (S.carByEv[e.id] || []).filter(c => c.equipment_id === id)[0];
    const curStock = cur ? fromStock(cur) : 0;
    const sub = cur ? Math.min(g.add, Number(cur.subnoleggio) || 0) : 0;
    g.after = ownNet(e, id) - curStock + (g.add - sub);       // quello che l'evento chiederà dopo il passaggio (righe + variazioni dei case)
    g.a = availFor(g.m, e);
    g.short = Math.max(0, g.after - Math.max(0, g.a.free));
    out.short += g.short;
    if (g.short) out.shortArts++;
  });
  return out;
}
function puOthers(a) {
  return a.used.filter(u => u.q > 0).map(u => u.e.cliente + ' ' + u.q +
    (u.e.stato === 'confermato' || u.e.stato === 'concluso' ? '' : ' (' + STAGE_LABEL[u.e.stato].toLowerCase() + ')')).join(', ');
}
/* La riga sotto una voce: quanti ce ne sono liberi */
function puAvInfo(r, calc) {
  const m = r.eq ? S.matById[r.eq] : null;
  if (!m) return null;
  const g = r.on ? calc.arts[r.eq] : null;
  const a = g ? g.a : availFor(m, PU.e), free = Math.max(0, a.free);
  if (stockOf(m) === 0) return { cls: 'bad', text: 'Nessun pezzo utilizzabile in magazzino.' };
  if (g) {
    if (g.short) {
      const o = puOthers(a);
      return { cls: 'bad', text: 'Mancano ' + g.short + ': servono ' + g.after + ', liberi ' + free + ' su ' + a.loose + (a.locked ? ' sciolti' : '') + (o ? ' · negli stessi giorni servono anche a ' + o : '') + '.' };
    }
    return { cls: 'ok', text: 'Servono ' + g.after + ' · liberi ' + free + ' su ' + a.loose + (a.locked ? ' sciolti' : '') + '.' };
  }
  return { cls: 'mut', text: 'Liberi ' + free + ' su ' + a.loose + (a.locked ? ' sciolti' : '') + '.' };
}
